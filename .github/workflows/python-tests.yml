name: Python tests (파이썬 코드 변경 시 회귀 검사)

# 왜 있는가
#
# 파이썬 본체(news_bot·ranking·daily_brief·story_cluster·issue_continuity·
# article_quality_gate …)를 고쳐도 **병합 전에 도는 검사가 없었다.** 기존
# 워크플로 넷은 전부 성격이 다르다:
#
#   crawl.yml        스케줄 수집. 테스트를 안 돈다.
#   daily-brief.yml  스케줄 발송. 테스트를 안 돈다.
#   weekly.yml       스케줄 주간 리포트. 테스트를 안 돈다.
#   deploy-web.yml   `web/**` 가 **main 에 들어온 뒤** 화면 테스트만 돈다.
#
# 그래서 루트 tests/ 1,100여 건은 로컬에서 기억해 돌릴 때만 돌았고, 회귀는
# 스케줄 잡이 실패하고 나서야 — 즉 발송이 한 번 나간 뒤에야 — 드러났다.
# 이 워크플로는 그 자리를 메운다: PR 에서 먼저 돈다.

on:
  pull_request:
    paths:
      - "**.py"
      - "tests/**"
      - "web/tests/**"
      - "requirements.txt"
      # 코드가 읽는 설정. 여기가 바뀌면 판정이 바뀐다.
      - "ranking_config.json"
      - "sources.json"
      - "keywords.json"
      - "entity_registry.json"
      - "issue_match_overrides.json"
      - "selection_overrides.json"
      - "social_topics.json"
      # 콘솔이 KV 에 적고 워크플로가 내려받는 덧칠. 위 파일들과 **같은 성질**이다 —
      # news_bot 이 정의 직후에 얹어 RSS_SOURCES·OFFICIAL_DIRECT_SOURCES·
      # ANTI_KEYWORDS 를 바꾼다. 사람이 손으로 커밋하지 않는다는 점만 다르고,
      # 판정을 바꾼다는 점은 같다.
      #
      # 2026-08-29 콘솔에서 더한 피드 하나(niftep.snu.ac.kr Google News 우회)가
      # 09-13 봇 커밋으로 main 에 들어왔는데, 이 목록에 없어서 아무 검사도 안 돌았다.
      # 2주 뒤 `.py` 를 건드린 첫 PR 이 test_collect 실패로 그것을 떠안았고, 로컬에서는
      # 재현되지 않아(그 PR 의 분기점에는 그 항목이 없다) 원인을 찾는 데 반나절이 들었다.
      - "admin_overrides.json"
      - ".github/workflows/python-tests.yml"
      # 워크플로 파일 자체. 실행 구조를 지키는 계약 검사가 tests/ 에 여럿 있는데
      # (test_cards_workflow · test_reusable_workflow_permissions · test_gemini_key_mode),
      # 그 계약을 깨는 변경은 대개 .py 를 한 줄도 안 건드린다 — 스텝 하나,
      # continue-on-error 한 줄, permissions 한 줄이다.
      #
      # 예전에는 여기서 cards.yml 과 daily-brief.yml 만 셌다. 2026-09-18
      # deploy-web.yml 에 permissions 한 줄이 늘었고 그것을 uses: 로 부르는
      # weekly.yml 만 따라가지 못했는데, 목록에 없어서 아무 검사도 안 돌았다.
      # 그 뒤 Weekly 는 열한 번 연속 startup_failure 로 죽었다 — 런이 시작조차
      # 안 하니 워크플로 안의 어떤 가드도 못 잡는 자리였다.
      #
      # 그래서 파일을 하나씩 세지 않는다. 디렉터리를 통째로 본다.
      - ".github/workflows/**"
  push:
    branches: [main]
    # 앵커(&python_paths)로 묶고 싶지만 Actions 파서가 YAML 앵커를 받지
    # 않는다 — 위 목록과 **함께** 고쳐야 한다.
    paths:
      - "**.py"
      - "tests/**"
      - "web/tests/**"
      - "requirements.txt"
      # 코드가 읽는 설정. 여기가 바뀌면 판정이 바뀐다.
      - "ranking_config.json"
      - "sources.json"
      - "keywords.json"
      - "entity_registry.json"
      - "issue_match_overrides.json"
      - "selection_overrides.json"
      - "social_topics.json"
      # 콘솔이 KV 에 적고 워크플로가 내려받는 덧칠. 위 파일들과 **같은 성질**이다 —
      # news_bot 이 정의 직후에 얹어 RSS_SOURCES·OFFICIAL_DIRECT_SOURCES·
      # ANTI_KEYWORDS 를 바꾼다. 사람이 손으로 커밋하지 않는다는 점만 다르고,
      # 판정을 바꾼다는 점은 같다.
      #
      # 2026-08-29 콘솔에서 더한 피드 하나(niftep.snu.ac.kr Google News 우회)가
      # 09-13 봇 커밋으로 main 에 들어왔는데, 이 목록에 없어서 아무 검사도 안 돌았다.
      # 2주 뒤 `.py` 를 건드린 첫 PR 이 test_collect 실패로 그것을 떠안았고, 로컬에서는
      # 재현되지 않아(그 PR 의 분기점에는 그 항목이 없다) 원인을 찾는 데 반나절이 들었다.
      - "admin_overrides.json"
      - ".github/workflows/python-tests.yml"
      # 워크플로 파일 자체. 실행 구조를 지키는 계약 검사가 tests/ 에 여럿 있는데
      # (test_cards_workflow · test_reusable_workflow_permissions · test_gemini_key_mode),
      # 그 계약을 깨는 변경은 대개 .py 를 한 줄도 안 건드린다 — 스텝 하나,
      # continue-on-error 한 줄, permissions 한 줄이다.
      #
      # 예전에는 여기서 cards.yml 과 daily-brief.yml 만 셌다. 2026-09-18
      # deploy-web.yml 에 permissions 한 줄이 늘었고 그것을 uses: 로 부르는
      # weekly.yml 만 따라가지 못했는데, 목록에 없어서 아무 검사도 안 돌았다.
      # 그 뒤 Weekly 는 열한 번 연속 startup_failure 로 죽었다 — 런이 시작조차
      # 안 하니 워크플로 안의 어떤 가드도 못 잡는 자리였다.
      #
      # 그래서 파일을 하나씩 세지 않는다. 디렉터리를 통째로 본다.
      - ".github/workflows/**"
  workflow_dispatch:

# 자동 수집물(curated.json·sent.json·delivery_log.jsonl·discovery_state.json·
# archive/** · web/public/data/**)만 바뀐 커밋은 위 목록에 하나도 안 걸려 이
# 워크플로가 아예 안 뜬다. 크롤은 시간당 한 번 그런 커밋을 밀어넣으므로 —
# 하루 24회, 코드 변화 0 — 걸러내지 않으면 이 검사가 전체 실행 시간의 대부분을
# 의미 없이 차지한다.

permissions:
  contents: read

concurrency:
  # 같은 브랜치에 커밋을 연달아 밀면 앞 실행은 이미 낡은 코드를 검사하는 중이다.
  # 취소하고 최신 것만 남긴다. main 은 브랜치명이 하나뿐이라 자연히 직렬화된다.
  group: python-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # 기본 회귀 검사는 **외부 호출 없이** 돈다. 키를 빈 값으로 못 박아 두면
      # gemini_client.enabled() 가 False 라, 어쩌다 목이 빠진 경로가 생겨도
      # 네트워크로 새지 않고 그 자리에서 드러난다. 실제 모델 품질 평가가 필요하면
      # 이 워크플로가 아니라 별도 eval 잡으로 둔다(Telegram·TTS·네이버·RSS 도 같다).
      GEMINI_API_KEY: ""
      TELEGRAM_BOT_TOKEN: ""
      TELEGRAM_CHAT_ID: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"      # crawl.yml·daily-brief.yml 과 같은 버전
          cache: pip

      - run: pip install -r requirements.txt

      # V5.1 does not pin dependencies in this refactor.  Preserve the resolver's exact
      # result in the job log so a local/CI difference can be diagnosed without guessing.
      - name: Resolved runtime versions
        run: |
          python --version
          python -m pip --version
          python -m pip freeze --all
          node --version
          npm --version

      # 루트 회귀 검사. 게이트·랭킹·story/issue·운영 알림까지 전부 여기 있다.
      - name: Root tests
        run: python -m unittest discover -s tests

      # web/tests/ 는 여기서 안 돈다.
      #
      # 그쪽 검사는 대부분 **빌드 산출물**(web/public/data/*.json)을 읽는데 그건
      # .gitignore:20 이라 체크아웃에 없다. 만들려면 build_data.py 를 돌려야 하고,
      # build_data 의 이슈 병합 회색지대 판정은 GEMINI_API_KEY 를 부른다 — 키 없이
      # 지으면 '병합 안 함'으로 떨어져 실제와 다른 데이터를 검사하게 된다
      # (deploy-web.yml 의 Build site data 주석에 2026-08-16 실측이 있다).
      # 외부 호출 0 이라는 이 워크플로의 전제와 정면으로 부딪힌다.
      #
      # 그래서 화면 파이썬은 데이터를 진짜로 짓는 deploy-web.yml 이 계속 맡는다.
      # 처음엔 여기서도 돌렸다가 PR #52 에서 FileNotFoundError 5건으로 드러났다.
      #
      # app.js 검사는 반대로 여기 있어야 한다 — 데이터를 안 읽고, 회귀가 나면
      # '집계 중'만 뜨는 조용한 실패라 눈으로는 안 잡힌다.
      # 이슈 상세의 「주요 사건 타임라인」이 같은 이슈의 기사가 아니라 **같은
      # 스토리의 다른 사건**을 세우는가. 이 회귀도 조용하다 — 상세는 멀쩡히 뜨고
      # 근거 기사도 다 있고, 없는 것은 "이 사건 앞에 무엇이 있었나" 하나뿐이다.
      # 데이터를 안 읽는 검사라 여기서 돈다.
      - name: Front-end date/selector tests
        run: |
          node --check web/public/app.js
          node web/tests/date_window.mjs
          node web/tests/report_format.mjs
          node web/tests/trend_period_state.mjs
          node web/tests/thread_dialog_section.mjs
      # 푸시는 **틀려도 조용하다.** 창구가 목록을 안 내주거나 토큰 검사가
      # 헐거워져도 예외도 빨간불도 없다 — 사용자는 "알림이 안 온다"만 안다.
      # 그래서 여기서 잠근다(빌드 산출물이 필요 없어 데이터 없이 돈다).
      #
      # 서명 검사(vapid_token.mjs)는 걷었다. 엣지가 더 이상 서명하지 않는다 —
      # 발송은 pywebpush 몫이고, 그쪽은 tests/test_push_notify.py 가 실제
      # 암호화까지 돌려 본다(루트 검사에 포함).
      - name: Web push contracts
        run: node web/tests/push_contract.mjs
