name: Daily Brief (통합 일일 브리핑)

env:
  SITE_URL: ${{ vars.SITE_URL || 'https://nuclens-v2.pages.dev' }}
  CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'nuclens-v2' }}

# 원자력뉴스봇 통합: news_bot(수집)이 쌓은 curated 큐를 국내/해외 카드 브리핑으로 발송.
# ※ 소셜(last30days)은 무겁고 타임아웃 위험이 있어 이 워크플로에선 제외 — curated(RSS) 중심.
#
# 발송 원자성 (outbox 패턴, 2026-07):
#   ① plan  — 선별→outbox.json(pending) 기록, 큐에서 발송분 hash 만 제거
#   ② claim push — outbox+큐를 발송 **전에** push. 실패하면 발송하지 않는다
#      (예전엔 발송 후 push 라 push 실패 시 다음날 통째 재발송·중복이 났음).
#      큐를 [] 로 덮지 않고 hash 단위로 지우므로, 그 사이 crawl 이 넣은 새 기사도 안전.
#   ③ send  — outbox 의 pending 브리핑만 발송 (재실행 시 sent 는 건너뜀 = 중복 억제)
#   ④ confirm push — 발송 결과·delivery_log 기록. 충돌 시 결과(outbox_result.json,
#      untracked 라 reset 에도 생존)를 재병합해 재시도.

on:
  # 매일 04:05 KST(전날 19:05 UTC)에 작업을 시작한다. 최신 기사 수집·선별과
  # 오디오 생성 시간을 확보해 이른 아침에 기사 → 빠른 오디오 → 전문가 오디오
  # 순으로 도착시키는 운영 목표다(순서는 잡 안의 스텝 순서로 보장된다).
  #
  # **정시(:00)를 피한다.** GitHub cron 은 예약대로 안 뜨고, 정시에 예약이 몰려
  # 대기가 더 길어진다. 몇 분만 밀어도 그 봉우리는 비켜 간다.
  #
  # 대기 실측은 갈린다 — 12일치(7/23~8/3)는 50~66분(중앙값 61분)으로 놀랍도록
  # 일정했고, 08-15 예약 실행은 15분이었다. 잡 자체는 13분쯤 걸린다. 그래서
  # 실제 도착은 04:25~05:20 KST 사이로 흔들린다. **cron 시각은 도착 보장이
  # 아니다.** 대기가 다시 60분대로 길어지면 예전에 쓰던 :25 로 더 밀면 된다.
  #
  # 크롤(`0 */3`)과는 겹치지 않는다. 19시대는 크롤이 비는 시간이고, 대기가 붙어
  # 20시대에 시작해도 21:00 UTC 크롤 전에 끝난다.
  schedule:
    - cron: '5 19 * * *'
  # GitHub가 특정 cron 이벤트를 누락해도, 다음 정상 크롤 완료가 아침 브리핑을
  # 복구한다. preflight가 04:00~12:00 KST와 오늘 sent 여부를 확인하므로 정상일의
  # 중복 발송은 만들지 않는다.
  workflow_run:
    workflows: ["Nuclear news crawl"]
    types: [completed]
  workflow_dispatch:
    inputs:
      force_audio:
        description: '오늘 오디오를 새 코드로 다시 생성 (텔레그램 재발송 안 함)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write   # outbox/큐/delivery_log 커밋

concurrency:
  # crawl과 sent.json을 동시에 고치면 관리자 알림의 발송 완료 표식이 유실될 수 있다.
  group: nuclens-state
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Decide whether to run the full brief
        id: gate
        env:
          TRIGGER_WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: python tools/daily_brief_trigger_gate.py

  brief:
    # 스위치가 둘이다. AUTOMATION_ENABLED 는 전체 정지용 마스터고, BRIEFING_ENABLED
    # 는 '발송'만 따로 잠근다 — 수집·웹 갱신은 돌리면서 텔레그램 발송은 내용을
    # 검토한 뒤에 켜고 싶은 구간이 있기 때문이다. 그 구간에 스위치가 하나뿐이면
    # 수집을 켜는 순간 발송도 같이 나간다.
    # workflow_dispatch 는 둘 다 우회한다 — 검토용 수동 실행이 그 목적이다.
    needs: preflight
    if: >-
      needs.preflight.outputs.should_run == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (vars.AUTOMATION_ENABLED == 'true' && vars.BRIEFING_ENABLED == 'true'))
    runs-on: ubuntu-latest
    # 정상 계산을 벽시계 시간으로 실패 처리하지 않는다. 2026-08-26 웹 데이터
    # 빌드는 누적 데이터가 커지며 6분을 넘겼지만, 같은 입력이 별도 배포 잡에서는
    # 약 19분 뒤 정상 완료됐다. 단계·잡 timeout-minutes 를 두면 느린 성공을 장애로
    # 바꾸고 뒤의 오디오·배포까지 연쇄 생략한다. 외부 요청별 connect/read timeout은
    # 각 Python 모듈이 따로 가지므로, 응답 없는 서버 하나를 영구 대기하지는 않는다.
    # 명시적 잡 제한을 두지 않아 GitHub Actions 기본 최대 실행시간을 사용한다.

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 정기 crawl(3시간마다)이 보존한 최신 임베딩을 웹 이슈 연결에도 사용한다.
      - name: Restore embeddings cache
        uses: actions/cache/restore@v4
        with:
          path: embeddings.json
          key: ${{ runner.os }}-nuclear-embeddings-daily-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-nuclear-embeddings-

      # 오디오 브리핑 mp3 는 git 이 아니라 Actions 캐시에 산다 (embeddings 패턴).
      # 이전 산출물이 있어야 같은 날짜 재실행이 TTS 를 다시 부르지 않는다.
      - name: Restore audio cache
        uses: actions/cache/restore@v4
        with:
          path: web/public/data/audio
          key: ${{ runner.os }}-nuclens-audio-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-nuclens-audio-

      # 브리핑 직전 최신분 1회 수집. 정기 crawl 이 3시간 간격이 되면서 마지막
      # 회차와 발송 사이가 최대 3시간(+cron 지연 ~1시간) 비는데, 그 사이에 뜬
      # 기사는 오늘 브리핑을 놓치고 하루를 넘긴다. 아침 도착 브리핑에서 새벽
      # 기사가 빠지는 건 눈에 띄는 구멍이라 여기서 한 번 더 걷는다.
      # 공식기관 게시판(OFFICIAL_DIRECT_SOURCES)도 이 회차에 함께 걸린다.
      #
      # 비치명이다 — 수집이 실패해도 이미 쌓인 큐로 브리핑은 나가야 한다.
      # news_bot 은 설정 오류(모델·키)에서 exit 1 로 알리는데(main 끝), 여기서는
      # 그 신호가 스텝 경고로 남고 발송은 계속된다. 같은 오류를 정기 crawl 이
      # 빨간불로 올리므로 알림이 사라지지는 않는다.
      # 운영 콘솔 판정을 수집·선정보다 먼저 내려놓는다. 어제 저녁에 콘솔에서 갈라
      # 둔 조합이 오늘 아침 브리핑에서 다시 접히면 검토한 의미가 없다.
      - name: Sync admin console judgments
        continue-on-error: true
        run: python tools/sync_admin_overrides.py
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Collect (브리핑 직전 최신 수집)
        id: collect
        continue-on-error: true
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.1-flash-lite' }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
        run: python news_bot.py

      # 공개 뉴스 채널과 운영 경고 채널을 분리한다. 관리자 채팅 ID가 없거나
      # Telegram 전송이 실패해도 수집·브리핑은 계속되고 다음 회차에 재시도한다.
      - name: Monitor source health + notify administrator
        if: always()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: >-
          python operational_alerts.py --notify
          --collect-outcome "${{ steps.collect.outcome }}"
          --collection-observation-id "daily-brief:${{ github.run_id }}"

      # 위 수집이 만든 상태를 **Plan 전에** 밀어 넣는다. Plan 뒤의 claim push 는
      # outbox·digest_queue 만 싣고, 충돌하면 `reset --hard origin/main` 을 하므로
      # 여기서 push 하지 못한 sent.json·curated.json·archive 는 그때 사라진다.
      # 사라지면 다음 정기 crawl 이 같은 기사를 신규로 다시 걷는다 — sent 기록이
      # 없으니 이미 브리핑에 나간 기사가 큐에 다시 앉는다.
      # 실패해도 브리핑은 계속한다(수집분을 못 쓸 뿐, 큐는 origin 에 온전하다).
      - name: Commit collected state
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sent.json curated.json digest_queue.json archive/
          for f in delivery_log.jsonl discovery_state.json publications.json admin_overrides.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          git diff --cached --quiet && { echo "수집분 없음 — 커밋 생략"; exit 0; }
          git commit -m "chore: pre-brief crawl state"
          # crawl.yml 과 같은 사다리 — append-only 로그는 .gitattributes 의
          # merge=union 이 받으므로 rebase 로 얹는다.
          for i in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            echo "push 충돌 — rebase 후 재시도 $i/3"
            git fetch origin main
            git rebase origin/main || { git rebase --abort; echo "!! rebase 충돌 — 수집분 포기"; exit 1; }
            sleep $((RANDOM % 8 + 4))
          done
          echo "!! push 3회 실패 — 수집분 미커밋 (브리핑은 계속)"
          exit 1

      - name: Backfill 21-day briefing embeddings
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_EMBEDDING_MODEL: gemini-embedding-2
        run: python embedding_pipeline.py --window-days 21 --max-new 150 --require-nonzero

      - name: Plan (선별 → outbox 작성 → 큐 정리)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.1-flash-lite' }}
        run: python daily_brief.py --plan

      - name: Push claim (발송 전 커밋 — 실패 시 발송 중단)
        id: claim
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.1-flash-lite' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git add outbox.json digest_queue.json
            # 구독 채널 배치의 **본문**을 여기서 함께 못 박는다. 뒤 스텝들이
            # `git reset --hard origin/main` 을 하므로, 커밋 안 된 채로 두면
            # 그때 텍스트가 지워지고 채널에는 오디오만 뜬다. 큐가 비는 날
            # (outbox=empty)에는 파일이 없을 수 있어 존재를 확인하고 add 한다.
            if [ -f channel_outbox.json ]; then git add channel_outbox.json; fi
            if git diff --cached --quiet; then echo "변경 없음 (재실행/empty)"; exit 0; fi
            git commit -m "chore: daily brief claim"
            if git push origin HEAD:main; then echo "claim push 성공"; exit 0; fi
            echo "push 충돌 — 재시도 $i/5"
            # 오늘 outbox 를 보존한 채 최신 main 위에서 재계획 (plan 은 오늘 outbox 재사용 → Gemini 재호출 0)
            cp outbox.json /tmp/outbox.keep
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/outbox.keep outbox.json
            python daily_brief.py --plan
            sleep $((RANDOM % 8 + 4))
          done
          echo "!! claim push 5회 실패 → 발송하지 않음 (중복 방지). 큐는 origin 에 그대로 남아 내일 재시도."
          exit 1

      - name: Send (텔레그램 발송)
        id: send
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python daily_brief.py --send

      - name: Confirm (결과 병합 + delivery log) — 충돌 시 재시도
        id: confirm
        if: always() && steps.claim.conclusion == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            python daily_brief.py --confirm
            git add outbox.json delivery_log.jsonl
            if git diff --cached --quiet; then echo "기록할 변경 없음"; exit 0; fi
            git commit -m "chore: daily brief confirm"
            if git push origin HEAD:main; then echo "confirm push 성공"; exit 0; fi
            echo "push 충돌 — 재시도 $i/5"
            git fetch origin main
            git reset --hard origin/main
            sleep $((RANDOM % 8 + 4))
          done
          echo "!! confirm push 5회 실패 — 발송 상태 미기록. 36h 창 안 재실행 시 중복 발송 가능성 (수동 확인 권장)"
          exit 1

      # Plan/최종 카드 게이트가 confirm에서 남긴 품질 이벤트를 웹 배포와 독립적으로
      # 관리자에게 보낸다. Cloudflare 미설정·웹 빌드 실패여도 기사 오류는 놓치지 않는다.
      - name: Notify administrator after brief quality checks
        if: always() && steps.confirm.conclusion == 'success'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: >-
          python operational_alerts.py --notify
          --collect-outcome "${{ steps.collect.outcome }}"
          --collection-observation-id "daily-brief:${{ github.run_id }}"

      # 알림 성공 표식을 바로 원격에 저장한다. 뒤 단계의 reset --hard 전에 밀어 넣어
      # 재실행 시 같은 관리자 경고가 중복 발송될 가능성을 줄인다.
      - name: Persist operational alert state
        if: always() && steps.confirm.conclusion == 'success'
        continue-on-error: true
        run: |
          git add sent.json
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: persist operational alert state"
          for i in 1 2 3; do
            git push origin HEAD:main && exit 0
            git fetch origin main || exit 1
            git rebase origin/main || { git rebase --abort; exit 1; }
          done
          echo "::warning::운영 알림 상태 push 실패 — 다음 실행에서 재시도"
          exit 1

      # 웹 트렌드 '흐름 해석' 생성 — 하루 1회, Gemini 호출 +1. 실패해도 브리핑엔 비치명.
      - name: Trend insights (웹 트렌드 흐름 해석)
        if: always() && steps.claim.conclusion == 'success'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.1-flash-lite' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python trend_insights.py
            # daily_lead 실패는 비치명 — trend insights 커밋을 같이 죽이면 안 된다
            # (2026-08-02 실사고: 파일 부재 → git add pathspec 실패 → 스텝 사망)
            python daily_lead.py || echo "[lead] daily_lead 실패 — 비치명, 계속"
            git add trend_insights.json
            if [ -f daily_leads.json ]; then git add daily_leads.json; fi
            if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
            git commit -m "chore: trend insights"
            if git push origin HEAD:main; then echo "insights push 성공"; exit 0; fi
            echo "push 충돌 — 재시도 $i/3"
            sleep $((RANDOM % 8 + 4))
          done
          echo "insights push 실패 — 비치명, 다음날 재시도"
          exit 0

      # ffmpeg 은 PCM→mp3 변환에만 쓴다 (audio_brief.to_mp3).
      #
      # apt 를 버렸다. 2026-08-20 이 스텝이 40분을 통째로 먹고 잡을 죽였고,
      # 상한을 걸어 재실행하니 이번엔 `apt-get install` 이 **출력 한 줄 없이**
      # 120초 상한에 두 번 연속 걸렸다 (22:07:01→22:09:01→22:11:07). update 는
      # 몇 초 만에 끝나는데 install 만 멈춘다 — 러너의 dpkg 잠금/프롬프트 쪽이다.
      # 원인을 더 좁힐 수는 있지만, 그 경로 자체가 필요 없다는 게 답이다.
      #
      # imageio-ffmpeg 는 정적 ffmpeg 바이너리를 담은 순수 pip 휠이다. sudo 도,
      # dpkg 잠금도, apt 미러도 타지 않는다 — 이미 매 실행 성공하는 PyPI 경로만
      # 쓴다. 번들 빌드에 libmp3lame·dynaudnorm·loudnorm 이 모두 들어 있어
      # to_mp3 의 필터 체인이 그대로 돈다 (v7.1, 실측 확인).
      #
      # $GITHUB_PATH 로 노출하므로 뒤 스텝의 shutil.which("ffmpeg") 가 그대로
      # 찾는다 — 파이썬 코드는 손댈 필요가 없다.
      - name: Install ffmpeg (오디오 브리핑용)
        if: always() && steps.claim.conclusion == 'success'
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            echo "ffmpeg 이미 설치됨 — $(ffmpeg -version 2>&1 | head -1)"
            exit 0
          fi
          if ! python -m pip install --quiet imageio-ffmpeg; then
            echo "::warning::imageio-ffmpeg 설치 실패 — 오디오 스킵 (비치명, 텍스트 공개는 계속)"
            exit 0
          fi
          ff=$(python -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())") || {
            echo "::warning::ffmpeg 바이너리 경로 확인 실패 — 오디오 스킵 (비치명)"
            exit 0
          }
          mkdir -p "$HOME/.local/ffmpeg-bin"
          chmod +x "$ff" 2>/dev/null || true
          ln -sf "$ff" "$HOME/.local/ffmpeg-bin/ffmpeg"
          # 이 스텝 안에서는 PATH 에 아직 안 붙는다 — 검증은 절대경로로 한다.
          "$HOME/.local/ffmpeg-bin/ffmpeg" -version | head -1
          echo "$HOME/.local/ffmpeg-bin" >> "$GITHUB_PATH"

      # 웹 빌드·품질 기록·배포를 별도 step outcome으로 남긴다. 예전의 한 덩어리
      # 스텝은 build_data가 먼저 죽으면 data_quality_gate 기록조차 만들지 못해,
      # 뒤 운영 알림이 "이상 없음"으로 오인했다.
      - name: Build web data
        id: web-build
        if: always() && steps.claim.conclusion == 'success'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.1-flash-lite' }}
        run: |
          git fetch origin main && git reset --hard origin/main
          python tools/run_with_heartbeat.py \
            --label "Build web data" \
            --heartbeat-seconds 60 \
            --stall-warning-seconds 300 \
            -- python -u web/build_data.py

      # 이슈 병합 전수 후보 덤프(web/_audit/). 배포 경로 밖이라 Cloudflare 로는
      # 안 올라간다 — 25 MiB 상한에 걸리는 것이 바로 이 데이터다
      # (build_data.AUDIT_FULL_DIR 주석). 임계값 실험은 이걸 내려받아서 한다:
      #   gh run download <run-id> -n issue-audit-full
      #
      # **하루 한 벌만** 남긴다. 비공개 저장소라 아티팩트가 계정 용량을 먹는데,
      # 크롤은 3시간마다 돌아 하루 8벌이 되고 그 여덟은 사실상 같은 데이터다.
      # 나머지 회차는 배포가 깨졌을 때만 올린다(그때가 실제로 필요한 때다).
      #
      # 아티팩트 **안에서는 파일이 최상위**다. upload-artifact 가 매칭 파일들의
      # 공통 조상을 루트로 잡으므로 `web/_audit/` 경로는 남지 않는다 — 받아서
      # 그 경로로 찾으면 없다. 앞 스텝의 `[issue_audit] artifact-ready` 블록에
      # 개수·크기·경로가 찍히니 아티팩트를 열기 전에 거기서 먼저 확인할 것.
      - name: Upload full issue audit
        if: always() && steps.web-build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: issue-audit-full
          path: web/_audit/issue_audit.full.json
          retention-days: 7
          if-no-files-found: ignore

      # 임계값 미달은 여전히 배포를 막지 않는다. 다만 산출물 부재·기록 실패는
      # non-zero outcome으로 남겨 운영 알림이 관측 실패 자체를 보고할 수 있게 한다.
      - name: Record web data quality metrics
        id: data-gate
        if: always() && steps.claim.conclusion == 'success' && steps.web-build.outcome == 'success'
        continue-on-error: true
        run: python data_gate_metrics.py

      # 오디오 브리핑 — build_data 산출물을 재료로 쓰므로 반드시 그 뒤, 배포 전
      # (mp3 가 web/public 안에 있어야 wrangler 가 같이 올린다).
      #
      # 배포 스텝에서 떼어 냈다. 두 가지를 얻는다: ① 오디오는 Cloudflare 토큰과
      # 무관한데 예전엔 토큰이 없으면 배포와 함께 통째로 건너뛰었다, ② 텔레그램
      # 시크릿이 wrangler·npx 가 도는 긴 프로세스로 상속되지 않는다(관리자 채팅
      # ID 를 배포에 넘기지 않는 것과 같은 이유).
      - name: Generate audio briefings (빠른 → 전문가)
        id: audio
        if: always() && steps.claim.conclusion == 'success' && steps.web-build.outcome == 'success'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.1-flash-lite' }}
          GEMINI_TTS_MODEL: ${{ vars.GEMINI_TTS_MODEL || 'gemini-3.1-flash-tts-preview' }}
          # 봇 DM 업로드용. 여기서 받는 file_id 가 구독 채널 공개의 재료다 —
          # 채널에는 mp3 를 다시 올리지 않고 그 문자열만 보낸다(channel_queue).
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # 실패해도 배포·채널 공개는 계속한다 (오디오는 부가 기능).
          # 1차 실패 시 90초 뒤 한 번 더. build_data 가 방금 같은 무료 버킷을
          # 쓰고 끝나는데 오디오가 곧바로 이어 붙어서, 분당 한도면 여기서 풀린다.
          # 잡 예산은 전문가 브리핑까지 포함해 40분으로 확장했다. generate() 는 그날
          # mp3 가 이미 있으면 스킵하므로 성공한 날엔 sleep 을 안 탄다.
          # 일일 한도였다면 재시도도 실패하고, 로그의 '[gemini] 일일 한도 판정'
          # 한 줄이 어느 쪽이었는지 말해 준다.
          audio_args=""
          if [ "${{ inputs.force_audio }}" = "true" ]; then
            audio_args="--force --no-send"
          fi
          python audio_brief.py $audio_args || {
            echo "[audio] 빠른 브리핑 1차 실패 — 90초 뒤 1회 재시도"
            sleep 90
            python audio_brief.py $audio_args || echo "[audio] 빠른 브리핑 재시도도 실패 — 비치명, 계속"
          }
          # 전문가 브리핑 — NucBrief의 dossier→시간배분→episode plan→1인 전문가
          # 대본→독립검증/수정 알고리즘을 nuclear의 기존 Gemini/TTS 스택 위에 이식.
          # fast와 audio.json variants를 공유하지만 서로 실패에 독립적이다.
          expert_args=""
          if [ "${{ inputs.force_audio }}" = "true" ]; then expert_args="--force --no-send"; fi
          python expert_audio_brief.py $expert_args || {
            echo "[expert-audio] 1차 실패 — 90초 뒤 1회 재시도"
            sleep 90
            python expert_audio_brief.py $expert_args || echo "[expert-audio] 재시도도 실패 — 빠른 브리핑/배포는 계속"
          }

      # 구독 채널 일괄 공개 — 그날 자료를 여기서 **처음이자 한 번에** 내보낸다.
      #
      # 자리가 곧 계약이다. 전문가 오디오가 그날 배치의 마지막 재료이므로 바로
      # 다음에 둔다. 앞의 Send·오디오 스텝은 봇 DM 으로만 나가는 리허설이고,
      # 구독자에게는 보고서추천 → 국내 → 해외 → 빠른 → 전문가가 한 묶음으로 간다.
      #
      # 배포보다 앞에 둔 이유: 채널 공개는 wrangler·스모크와 아무 관련이 없는데
      # 뒤에 두면 배포가 느린 날 그만큼 구독자 도착이 밀린다.
      #
      # TELEGRAM_CHAT_ID 를 일부러 넘기지 않는다. channel_queue 는 채널 ID 가
      # 없으면 공개를 건너뛰지 DM 으로 폴백하지 않는다 — 폴백하면 '나 혼자만
      # 받는' 상태가 실패보다 알아채기 어려운 모습으로 굳는다.
      - name: Publish to subscriber channel (구독 채널 일괄 공개)
        id: channel
        if: always() && steps.claim.conclusion == 'success'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: python channel_queue.py --publish

      # 아침 브리핑·흐름 해석을 nuclens.pages.dev에 즉시 반영 (하루 1회 확정 배포)
      - name: Deploy web to Cloudflare Pages
        id: web-deploy
        if: always() && steps.claim.conclusion == 'success' && steps.web-build.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "CLOUDFLARE_API_TOKEN 미설정 — 웹 배포 스킵"; exit 0; fi
          npx --yes wrangler@4 pages deploy web/public --project-name="$CLOUDFLARE_PAGES_PROJECT" --branch=main --commit-dirty=true
          # 배포 후 라이브 스모크 (crawl.yml과 동일 기준)
          sleep 15
          base="$SITE_URL"; cb=$(date +%s)
          count=$(curl -sf --max-time 30 "$base/data/news.json?cb=$cb" | python -c "import json,sys; print(len(json.load(sys.stdin)))") \
            || { echo "::error::스모크 실패 — news.json이 JSON이 아니거나 접근 불가"; exit 1; }
          [ "$count" -gt 0 ] || { echo "::error::스모크 실패 — 기사 0건"; exit 1; }
          echo "스모크 OK — 기사 ${count}건"
          # 운영 콘솔이 인증 없이 열려 있지 않은지 확인한다. Function 폴더가 업로드
          # 에서 빠져도 배포는 조용히 성공하므로, 살아 있는 사이트에 직접 물어야 안다.
          bash web/tools/verify_admin_gate.sh "$base"

      # 관리자 secret은 이 짧은 전용 프로세스에만 노출한다. Deploy/audio/wrangler는
      # TELEGRAM_ADMIN_CHAT_ID를 상속하지 않는다. 미발송 경고는 익일에도 재시도된다.
      - name: Notify administrator after web quality checks
        if: always()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: |
          pipeline_args=()
          # claim 실패로 웹 경로 전체가 의도적으로 생략된 날은 평가하지 않는다.
          # 웹 경로가 예정된 실행에서만 각 step의 raw outcome을 명시적으로 넘긴다.
          if [ "${{ steps.claim.conclusion }}" = "success" ]; then
            pipeline_args=(
              --web-build-outcome "${{ steps.web-build.outcome }}"
              --data-gate-outcome "${{ steps.data-gate.outcome }}"
              --web-deploy-outcome "${{ steps.web-deploy.outcome }}"
              --pipeline-observation-id "daily-brief:${{ github.run_id }}"
            )
          fi
          python operational_alerts.py --notify \
            --collect-outcome "${{ steps.collect.outcome }}" \
            --collection-observation-id "daily-brief:${{ github.run_id }}" \
            "${pipeline_args[@]}"

      # 오디오 산출물을 다음 배포(정기 crawl·deploy-web)가 복원할 수 있게 저장.
      # audio.json 이 있어야 저장한다 — 빈 디렉터리 저장은 경고만 남긴다.
      - name: Check audio cache
        if: always()
        id: audio-cache
        run: |
          if [ -f web/public/data/audio/audio.json ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Save audio cache
        if: always() && steps.audio-cache.outputs.available == 'true'
        uses: actions/cache/save@v4
        with:
          path: web/public/data/audio
          key: ${{ runner.os }}-nuclens-audio-${{ github.run_id }}

      # 이슈 병합·KEEI 매칭 LLM 판정 캐시. 위 배포 스텝의 git reset --hard 뒤에
      # build_data 가 쓰기 때문에 여기서 따로 커밋해야 살아남는다.
      # 캐시가 없으면 빌드마다 같은 쌍을 다시 묻고(KEEI 는 최대 150쌍) 판정이
      # 흔들린다.
      - name: Commit issue review cache + data gate metrics
        if: always()
        run: |
          # 파일별로 가드한다 — 한 파일이 없어서 git add 가 실패하면 나머지
          # 파일의 커밋까지 같이 죽는다(daily_leads.json 데드락과 같은 함정).
          #
          # delivery_log.jsonl 은 위 배포 스텝의 data_gate_metrics 가 한 줄
          # 덧붙인다. 그 스텝은 git reset --hard 로 시작하므로 Confirm 이 커밋한
          # 뒤의 추가분이고, 여기서 싣지 않으면 러너와 함께 사라진다.
          # append-only 라 .gitattributes 의 merge=union 이 충돌을 받는다.
          #
          # channel_outbox.json 은 오디오 스텝이 file_id 를 붙이고 공개 스텝이
          # 발송 상태를 적은 뒤다. 여기서 싣지 않으면 러너와 함께 사라지고,
          # 같은 날 재실행이 이미 나간 자료를 다시 채널에 올린다.
          for f in issue_llm_reviews.json keei_llm_matches.json issue_insights.json delivery_log.jsonl sent.json channel_outbox.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: issue review cache + data gate metrics"
          for i in 1 2 3; do
            git push origin HEAD:main && exit 0
            git fetch origin main || exit 0
            git rebase origin/main || { git rebase --abort || true; exit 0; }
          done
          echo "캐시 push 실패 — 비치명, 다음 빌드에서 재시도"

      # 하루 1회 실제 브라우저 렌더링 검증 — API 정상인데 app.js 오류로 화면만
      # 깨지는 경우(2026-08-01 빈 화면 사고 유형)를 잡는다. 브라우저 설치 비용
      # 때문에 정기 crawl이 아닌 여기서만 실행.
      - name: Render smoke (라이브 화면 검증)
        if: always() && steps.claim.conclusion == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "배포 미사용 — 렌더링 스모크 스킵"; exit 0; fi
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium
          node web/tests/render_smoke.mjs
