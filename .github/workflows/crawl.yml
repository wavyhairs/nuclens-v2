name: Nuclear news crawl

env:
  SITE_URL: ${{ vars.SITE_URL || 'https://nuclens-v2.pages.dev' }}
  CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'nuclens-v2' }}

on:
  schedule:
    # 3시간 간격. 검색 창(LOOKBACK_HOURS=6)의 절반이라 cron 이 한 회차 밀려도
    # 창이 끊기지 않는다 — 매시간에서 내린 이유는 유입 자체가 아니라 그 유입이
    # 전부 LLM 큐레이션을 타서 Gemini 무료 쿼터를 태우기 때문이다.
    # 브리핑 직전 최신분은 daily-brief.yml 이 따로 1회 수집한다.
    # GitHub cron 혼잡이 큰 정각을 피하되 3시간 주기는 유지한다. 독립 Worker는
    # 각 slot의 :37부터 누락을 복구하므로 이 시각 자체가 단일 장애점은 아니다.
    - cron: "11 */3 * * *"
  workflow_dispatch:
    inputs:
      fetch_publications:
        description: "발간물 수집 강제 실행 (시간 게이트 무시)"
        type: boolean
        default: false
      trigger_source:
        description: "호출자 식별 (수동 실행은 manual 유지)"
        type: string
        default: "manual"
      recovery_reason:
        description: "watchdog 복구 사유"
        type: string
        default: ""
      recovery_lookback_hours:
        description: "복구 수집 창 (6~24시간, 정상은 6)"
        type: string
        default: "6"

permissions:
  contents: write

concurrency:
  # sent.json(수집 이력+운영 알림 상태)을 함께 쓰는 daily-brief와 직렬화한다.
  group: nuclens-state
  cancel-in-progress: false

jobs:
  preflight:
    # 운영 중지 스위치는 watchdog도 우회하지 않는다. 사람이 누른 수동 dispatch만
    # 기존처럼 AUTOMATION_ENABLED와 무관하게 강제 실행할 수 있다.
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.trigger_source != 'backup_watchdog') ||
      vars.AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.claim.outputs.should_run }}
      slot: ${{ steps.claim.outputs.slot }}
      attempt_id: ${{ steps.claim.outputs.attempt_id }}
      trigger_state: ${{ steps.claim.outputs.trigger_state }}
    steps:
      # event SHA는 대기 중 낡을 수 있다. schedule/backup 중 먼저 끝난 claim을
      # 반드시 최신 main에서 읽어야 두 번째 run이 수집 전에 멈춘다.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Claim three-hour crawl slot
        id: claim
        env:
          TRIGGER_SOURCE: ${{ inputs.trigger_source }}
          RECOVERY_REASON: ${{ inputs.recovery_reason }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            python tools/crawl_trigger_gate.py claim \
              --event-name "${{ github.event_name }}" \
              --trigger-source "$TRIGGER_SOURCE" \
              --recovery-reason "$RECOVERY_REASON" \
              --run-id "${{ github.run_id }}"
            should_run=$(python -c 'import json; print(str(json.load(open("crawl_gate_result.json"))["should_run"]).lower())')
            if [ "$should_run" != "true" ]; then
              echo "같은 crawl slot이 이미 claim/완료됨 — 수집 스킵"
              exit 0
            fi
            git add crawl_runs.json
            git commit -m "chore: claim crawl slot"
            if git push origin HEAD:main; then exit 0; fi
            echo "claim push 충돌 — 최신 main에서 재판정 $i/5"
            git fetch origin main
            git reset --hard origin/main
          done
          echo "::error::crawl slot claim push 5회 실패 — 수집하지 않음"
          exit 1

      - name: Publish trigger state
        if: always()
        run: |
          echo "### Crawl trigger" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- trigger: \`${{ steps.claim.outputs.trigger_state }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- slot: \`${{ steps.claim.outputs.slot }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- should run: \`${{ steps.claim.outputs.should_run }}\`" >> "$GITHUB_STEP_SUMMARY"

  crawl:
    needs: preflight
    if: needs.preflight.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    # 막힌 실행이 기본 6시간 동안 다음 크롤을 막지 못하게 한다.
    #
    # 30 분이었다. 그 값이 **완주하는 회차보다 짧아졌다** — 실측 2026-09-04
    # (run 33833880969 · 33845140906 · 33859264667) 세 회차 연속으로 제한이
    # `Deploy web to Cloudflare Pages` **한복판에** 떨어져 cancelled 로 끝났다.
    # 그 회차들은 수집·상태 커밋을 이미 마쳤고 빌드도 success 였다. 19~20분짜리
    # 빌드 뒤에 배포가 설 자리가 없었을 뿐이다. 06:37 회차는 더 얄궂다 —
    # wrangler 가 07:07:41 에 `Deployment complete` 를 찍고 7 초 뒤 sleep 15
    # 도중에 잘렸다. 배포는 실제로 됐는데 운영 알림은 '배포 실패'로 나갔다.
    #
    # 실측 예산(2026-09-01~09-04, 배포 창에 든 회차 17건):
    #   setup+checkout+pip   ~0.3 분
    #   Collect news         4.7 ~ 9.7 분
    #   상태·임베딩·커밋      ~0.5 분
    #   Build web data      12.6 ~ 20.7 분   ← 누적 데이터와 함께 자란다
    #   Deploy              0.6 ~ 3.2 분    ← `npx --yes wrangler@4` 설치만
    #                                          21초~164초로 흔들린다
    #   Smoke + 알림 + 캐시  ~0.6 분
    # 완주한 회차의 최댓값은 29.5 분이고, 각 단계의 최댓값을 전부 더하면 약 35 분이다.
    #
    # 45 는 그 합에 10 분을 더한 값이다. 늘리는 목적은 '느린 성공을 살리는 것'
    # 뿐이고 이 제한의 원래 목적 — 막힌 실행이 `nuclens-state` 락을 오래 쥐지
    # 못하게 하는 것 — 은 그대로다: 45 분은 크롤 주기(3시간)와 배포 간격
    # 게이트(165분) 양쪽보다 훨씬 짧고, watchdog 의 stale_claim 판정(45분)도
    # 건드리지 않는다(claim 은 수집이 끝나는 ~10분에 이미 running 을 벗어난다).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # news_bot이 계산한 임베딩을 다음 실행과 웹 이슈 클러스터링에서 재사용한다.
      # 캐시는 immutable이므로 run_id별로 저장하고 최신 prefix를 복원한다.
      - name: Restore embeddings cache
        uses: actions/cache/restore@v4
        with:
          path: embeddings.json
          key: ${{ runner.os }}-nuclear-embeddings-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-nuclear-embeddings-

      # 운영 콘솔(/admin)에서 내린 판정을 파일로 내려놓는다. **수집보다 먼저** 돌아야
      # 이번 회차부터 듣는다 — 뒤에 두면 콘솔에서 지운 키워드가 한 번 더 검색에 나간다.
      # 실패해도 exit 0 이고 커밋된 파일이 그대로 쓰인다(조용한 되돌림 금지).
      - name: Sync admin console judgments
        run: python tools/sync_admin_overrides.py
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Collect news
        id: collect
        run: python news_bot.py
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          # 텔레그램 키는 넘기지 않는다 — crawl 은 발송하지 않는다(news_bot 상단 주석).
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.1-flash-lite' }}
          # 이메일 뉴스레터 수집 (선택 — 미설정 시 자동 스킵)
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
          CRAWL_LOOKBACK_HOURS: ${{ inputs.recovery_lookback_hours || '6' }}

      - name: Finalize crawl slot state
        id: crawl-state
        if: always()
        run: >-
          python tools/crawl_trigger_gate.py finalize
          --slot "${{ needs.preflight.outputs.slot }}"
          --attempt-id "${{ needs.preflight.outputs.attempt_id }}"
          --collect-outcome "${{ steps.collect.outcome }}"
          --new-article-count "${{ steps.collect.outputs.new_article_count || '0' }}"

      # 수집 결과 0건과 실제 접속·파서 실패를 분리해 회차별 상태로 누적한다.
      # news_bot이 source_yield를 쓰기 전에 죽어도 step outcome으로 즉시 감지한다.
      # 관리자 전용 채팅만 사용하며 전송 실패는 pending으로 남아 다음 회차에 재시도된다.
      - name: Update source health + notify administrator
        if: always()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: >-
          python operational_alerts.py --notify
          --collect-outcome "${{ steps.collect.outcome }}"
          --collection-observation-id "crawl:${{ github.run_id }}"

      # 수집 후보가 아니라 실제 최근 브리핑 기사 기준으로 21일 캐시를 백필한다.
      # API 장애 시 크롤 본체는 계속하고 웹은 로컬 후보 벡터로 안전하게 폴백한다.
      - name: Backfill 21-day briefing embeddings
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_EMBEDDING_MODEL: gemini-embedding-2
        run: python embedding_pipeline.py --window-days 21 --max-new 150 --require-nonzero

      - name: Check embeddings cache
        id: embeddings-cache
        run: |
          count=$(python -c "import json; from embedding_pipeline import cached_vector; p='embeddings.json'; d=json.load(open(p, encoding='utf-8')) if __import__('os').path.exists(p) else {}; print(sum(cached_vector(v) is not None for v in d.values()))")
          if [ "$count" -gt 0 ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "임베딩 캐시 ${count}건"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "임베딩 캐시 0건 — 로컬 후보 벡터 + 제목·태그 fallback 사용"
          fi

      - name: Save embeddings cache
        if: steps.embeddings-cache.outputs.available == 'true'
        uses: actions/cache/save@v4
        with:
          path: embeddings.json
          key: ${{ runner.os }}-nuclear-embeddings-${{ github.run_id }}

      - name: Sync recent archive to policy web
        continue-on-error: true
        # policy_web_sync.py 는 별도 트랙(Supabase 웹)에서 준비 중 — 파일이 커밋되면
        # 자동 활성화. 없을 땐 스킵해 회차마다 에러 표시로 진짜 장애가 묻히는 것을 방지.
        run: |
          if [ ! -f policy_web_sync.py ]; then echo "policy_web_sync.py 없음 — 스킵"; exit 0; fi
          python policy_web_sync.py --lookback-days 7
        env:
          POLICY_WEB_URL: ${{ vars.POLICY_WEB_URL }}
          POLICY_INGEST_TOKEN: ${{ secrets.POLICY_INGEST_TOKEN }}

      # 국제기구 발간물 수집 — 하루 1회. zero-LLM, 요청 소스당 1회.
      # "몇 시인가"가 아니라 "오늘 했는가"로 판단한다(--once-per-day). cron 지연으로
      # 특정 시각을 놓치면 그날 수집이 통째로 빠지는데, IAEA·EIA 는 RSS 최신
      # 40건만 노출하고 워터마크가 없어 그 사이 발간물이 영구 유실된다.
      # 이미 수집한 날은 즉시 리턴하므로 3시간마다 돌아도 HTTP 요청 0.
      # Pages 배포 예산 +0 — 다음 회차 배포·daily-brief 배포에 자연 반영.
      - name: Fetch publications (1일 1회)
        continue-on-error: true
        env:
          # 영문 제목의 한국어 해석용(배치 1회). 없으면 원문 제목으로 뜬다.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.1-flash-lite' }}
        run: |
          if [ "${{ inputs.fetch_publications }}" = "true" ]; then
            echo "dispatch 강제 실행"; python pubs_fetch.py
          else
            python pubs_fetch.py --once-per-day
          fi

      # 달력 전용 공식 일정 수집 — 하루 1회. zero-LLM, 기관 게시판 5곳.
      # 발간물과 같은 편성·같은 게이트를 쓴다(--once-per-day). 기관 공지는
      # 하루 사이에 몇 건 늘고 마는데 3시간마다 다섯 사이트를 두드릴 이유가 없다.
      # 국회 일정만 날짜별 상세를 받으므로 요청이 십여 회로 늘고, 나머지는 1회다.
      #
      # 실패해도 달력은 기사 경로만으로 그대로 선다 — 그래서 continue-on-error.
      - name: Fetch official event schedule (1일 1회)
        continue-on-error: true
        run: |
          if [ "${{ inputs.fetch_publications }}" = "true" ]; then
            echo "dispatch 강제 실행"; python event_sources.py
          else
            python event_sources.py --once-per-day
          fi

      # id 를 붙인다 — 수집 도메인의 성공은 '수집이 돌았다'가 아니라 '수집 결과가
      # main 에 남았다'까지다. 아래 failure domain 요약이 이 outcome 을 읽는다.
      - name: Commit state
        id: state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sent.json curated.json digest_queue.json archive/
          if [ -f publications.json ]; then git add publications.json; fi
          # 공식 일정 저장본. 커밋해야 '최초 확인일'이 살아남는다 — 협회
          # 일정표에는 게시일 칸이 없어 그 값이 '우리가 처음 본 날'이고,
          # 러너와 함께 버리면 매 실행 오늘로 되살아난다.
          if [ -f event_schedule.json ]; then git add event_schedule.json; fi
          # 크롤이 delivery_log.jsonl 에 남기는 진단 기록(큐레이션 유실·
          # open_question 게이트 사유)이 이 목록에 없어서 러너와 함께 버려지고
          # 있었다. 실측(2026-08-04): 커밋된 173건이 전부 발송 기록이고
          # record_type 이 붙은 줄은 0건 — 두 기능 다 도입 이후 한 줄도 안 남았다.
          if [ -f delivery_log.jsonl ]; then git add delivery_log.jsonl; fi
          # discovery 쿼리 상태(성과·냉각). 커밋 안 하면 매 시각 같은 쿼리를
          # 다시 던지고 헛도는 조합을 영영 못 재운다 — 캐시와 같은 함정이다.
          if [ -f discovery_state.json ]; then git add discovery_state.json; fi
          # 신규 이슈 탐색 상태(임시 검색어·TTL·성과). 커밋 안 하면 매 회차마다
          # 같은 이름을 새로 '발견'하고 TTL 도 성과 기록도 매번 0 에서 시작한다 —
          # 연장도 폐기도 영영 일어나지 않는다.
          if [ -f adaptive_state.json ]; then git add adaptive_state.json; fi
          # 콘솔 판정. 커밋해야 git 이 계속 DB 이고, 판정 하나하나가 이력에 남는다 —
          # KV 만 진실이면 "언제 누가 이 키워드를 지웠나"를 되짚을 곳이 없다.
          if [ -f admin_overrides.json ]; then git add admin_overrides.json; fi
          # schedule 미생성·workflow 실패·성공 0건을 slot별로 구분하는 durable log.
          git add crawl_runs.json
          git diff --cached --quiet || git commit -m "chore: update bot state"
          # daily-brief 의 재시도 사다리(fetch + reset --hard + 재생성)는 여기 못
          # 쓴다 — 그쪽은 outbox.json 에서 다시 만들 수 있지만 크롤은 이미 Gemini
          # 호출을 마친 뒤라 reset 하면 이번 시각 수집이 통째로 사라진다.
          # append-only 로그는 .gitattributes 의 merge=union 이 받으므로 rebase 로
          # 얹는다(양쪽에서 추가된 줄이 둘 다 남는다).
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "push 충돌 — rebase 후 재시도 $i/5"
            git fetch origin main
            git rebase origin/main || { git rebase --abort; echo "!! rebase 충돌 — 수동 확인 필요"; exit 1; }
            sleep $((RANDOM % 8 + 4))
          done
          echo "!! push 5회 실패 — 이번 시각 상태 미커밋"
          exit 1

      - name: Publish crawl result state
        if: always()
        run: |
          echo "### Crawl result" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- trigger: \`${{ needs.preflight.outputs.trigger_state }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- workflow/collection: \`${{ steps.crawl-state.outputs.collection_state }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- new articles: \`${{ steps.crawl-state.outputs.new_article_count }}\`" >> "$GITHUB_STEP_SUMMARY"

      # 오디오 브리핑 mp3 — daily-brief 가 만들고 Actions 캐시로만 산다. 복원
      # 없이 배포하면 오디오 없는 스냅샷이 라이브를 덮어 플레이어가 404 를 문다.
      # 읽기만 한다 — 캐시의 주인은 daily-brief.yml 이다 (embeddings 와 동일 규칙).
      - name: Restore audio cache
        uses: actions/cache/restore@v4
        with:
          path: web/public/data/audio
          key: ${{ runner.os }}-nuclens-audio-never-matches
          restore-keys: |
            ${{ runner.os }}-nuclens-audio-

      # 웹 갱신을 세 스텝으로 가른다: 배포 창 판정 / 데이터 빌드 / 업로드.
      #
      # 예전엔 한 덩어리였다. 그래서 `python web/build_data.py` 가 죽으면 스텝이
      # 죽고, 스텝이 죽으면 잡이 죽고, 잡이 죽으면 **이미 끝나 push 까지 마친
      # 수집이 '크롤 실패'로 읽혔다** (실측 2026-09-01 run 33508671552 외 4건:
      # 팰리세이즈/자포리자 issue_id 충돌). 게다가 이 회차들의 운영 알림은
      # 수집 관점만 보고 "이상 없음"으로 나갔다 — 웹이 깨진 사실은 워크플로가
      # 빨간 것 말고는 어디에도 없었다.
      #
      # 스텝을 가르면 outcome 이 셋으로 갈리고, 그 셋을 아래 운영 알림·요약이
      # 따로 읽는다. continue-on-error 는 outcome 을 지우지 않는다 — `failure`
      # 로 그대로 남고 잡만 계속된다. 뒤 스텝의 조건도 raw outcome 을 본다.
      - name: Decide web deploy window
        id: web-gate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN 미설정 — 웹 갱신 스킵"
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # 배포 간격은 '지금 몇 시인가'가 아니라 '마지막 배포 이후 얼마나
          # 지났나'로 잰다. 시각 기반 판정은 cron 지연에 취약하다 — GitHub cron 은
          # 상시 밀리는데, 예약 시각에 걸어 두면 밀린 실행이 판정을 빗나가
          # 건너뛰고 그 다음 실행도 건너뛴다. 그러면 배포가 통째로
          # 사라진다(2026-08-03 실측: 23:17 UTC 이후 4시간 배포 0회).
          # 라이브 meta.json 의 생성 시각을 보고 판단하므로 상태 파일이 필요 없다.
          #
          # 목표 간격 3시간에서 15분을 뺀 값이다. 정확히 180 으로 두면 179분에
          # 도착한 회차가 건너뛰고 다음 회차까지 3시간을 더 기다려 실제 간격이
          # 6시간이 된다 — 여유분은 cron 지연을 흡수하라고 있는 것이다.
          MIN_GAP_MIN=165
          age=$(python - <<'PY'
          import json, time, urllib.request
          from datetime import datetime
          try:
              req = urllib.request.Request(
                  f"{__import__('os').environ.get('SITE_URL', 'https://nuclens-v2.pages.dev')}/data/meta.json?cb={int(time.time())}",
                  headers={"User-Agent": "nuclens-deploy-gate/1.0"})
              built = json.load(urllib.request.urlopen(req, timeout=20))["generated_at"]
              age = (datetime.now(datetime.fromisoformat(built).tzinfo)
                     - datetime.fromisoformat(built)).total_seconds() / 60
              print(int(age))
          except Exception:
              print(99999)  # 확인 실패 시엔 배포한다 — 낡은 사이트가 더 나쁘다
          PY
          )
          echo "마지막 배포로부터 ${age}분 경과 (최소 간격 ${MIN_GAP_MIN}분)"
          if [ "$age" -lt "$MIN_GAP_MIN" ]; then
            echo "간격 미달 — 배포 스킵"
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "should_deploy=true" >> "$GITHUB_OUTPUT"

      # 빌드 실패는 웹 도메인의 실패다. 수집 결과를 오염시키지 않는다.
      # 국소 identity 충돌은 여기서 죽지 않고 fallback ID 로 격리한 뒤
      # build_mode=degraded 를 output 으로 내보낸다. systemic corruption 은
      # 예전 그대로 예외로 죽는다(fail-closed) — 그 경우 outcome=failure 다.
      - name: Build web data
        id: web-build
        if: steps.web-gate.outputs.should_deploy == 'true'
        continue-on-error: true
        env:
          # 이슈 병합 회색지대 LLM 판정용. 없으면 판정을 못 해 '병합 안 함'으로
          # 떨어지고, 새 쌍은 daily-brief 빌드까지 최대 하루를 기다리게 된다.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python web/build_data.py

      # nuclens.pages.dev 갱신 — 3시간 간격.
      # Pages 무료 티어 월 500회 제한: 크롤이 3시간마다이므로 회차마다 배포해도
      # 하루 8회(~240회/월)로 여유가 있다. daily-brief 배포분이 더해져도 마찬가지.
      - name: Deploy web to Cloudflare Pages
        id: web-deploy
        if: steps.web-gate.outputs.should_deploy == 'true' && steps.web-build.outcome == 'success'
        continue-on-error: true
        # 이 스텝만 따로 묶는다. 잡 제한이 여기서 떨어지면 **뒤가 통째로 잘린다** —
        # 스모크도, 운영 알림도, issue review 캐시 커밋도 못 돈다(2026-09-04 세
        # 회차가 그랬다). 스텝 제한이 먼저 떨어지면 `continue-on-error` 가 받아
        # outcome=failure 로 남고 뒤 스텝은 전부 정상 실행된다 — 웹 도메인만
        # 실패로 보고되고 수집 결과는 그대로다.
        #
        # 8 분은 실측 최장 완주(약 3.2분: npx 설치 164초 + 업로드 20초 + sleep 15)
        # 의 두 배 반이다. 정상은 40초라 느린 회차를 죽이지 않는다. 여기서 죽는
        # 것은 npm 레지스트리나 wrangler 가 응답을 멈춘 회차뿐이고, 그건 느린
        # 성공이 아니라 실패다. 다음 회차는 라이브 meta.json 이 낡은 것을 보고
        # (배포 간격 게이트) 같은 데이터를 다시 올린다.
        timeout-minutes: 8
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages deploy web/public --project-name="$CLOUDFLARE_PAGES_PROJECT" --branch=main --commit-dirty=true
          # 운영 콘솔이 인증 없이 열려 있지 않은지 확인한다. Function 폴더가 업로드
          # 에서 빠져도 배포는 조용히 성공하므로, 살아 있는 사이트에 직접 물어야 안다.
          sleep 15
          bash web/tools/verify_admin_gate.sh "$SITE_URL"

      # 이슈 병합 회색지대 LLM 판정 캐시. 커밋하지 않으면 빌드마다(하루 8회+)
      # 같은 쌍을 다시 물어보게 되고, 판정이 흔들리면 이슈 묶음도 같이 흔들린다.
      # 배포 스텝 뒤라 앞의 "Commit state" 에 실을 수 없어 별도 스텝으로 둔다.
      # 실패해도 크롤 본연 기능에 비치명이므로 항상 성공으로 끝낸다.
      - name: Commit issue review cache
        if: always()
        run: |
          # 파일별로 가드한다 — 한 파일이 없어서 git add 가 실패하면 나머지
          # 파일의 커밋까지 같이 죽는다(daily_leads.json 데드락과 같은 함정).
          for f in issue_llm_reviews.json keei_llm_matches.json issue_insights.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: issue review cache"
          for i in 1 2 3; do
            git push origin HEAD:main && exit 0
            git fetch origin main || exit 0
            git rebase origin/main || { git rebase --abort || true; exit 0; }
          done
          echo "캐시 push 실패 — 비치명, 다음 빌드에서 재시도"

      # 배포 후 라이브 스모크 — "데이터는 올라갔는데 화면이 죽는" 사고(2026-08-01) 재발 감지.
      # 라이브가 깨졌다는 사실은 수집이 실패했다는 뜻이 아니다. outcome 은
      # `failure` 로 남고(아래 요약이 읽는다) 잡은 계속한다.
      #
      # **이번 배포가 성공한 회차에만 돈다.** 예전엔 조건이 없어서(암묵
      # `success()`) 배포 창에 들지 않은 회차에도 직전 배포본을 검사했다.
      # 스킵된 스텝은 잡 상태를 바꾸지 않으므로 `success()` 가 그대로 참이고,
      # 그래서 `web-build=skipped · web-deploy=skipped · web-smoke=success` 라는
      # 조합이 나왔다 — 아무것도 짓지도 올리지도 않은 회차가 웹 `success` 로
      # 보고되는 상태다. 스모크는 '지금 올린 것이 사는가'를 보는 검사이므로
      # 올린 회차에만 도는 것이 그 의미와도 맞는다.
      #
      # 배포를 건너뛴 회차의 라이브 상태는 그 사이 배포한 워크플로가 본다
      # (daily-brief 는 자기 배포 뒤 스모크 + 렌더 스모크, deploy-web 도 자체 스모크).
      - name: Smoke test live site
        id: web-smoke
        if: steps.web-deploy.outcome == 'success'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "배포 미사용 — 스모크 스킵"; exit 0; fi
          sleep 15
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$SITE_URL/data/__missing__.json?cb=$(date +%s)")
          [ "$code" = "404" ] || { echo "::error::스모크 실패 — SPA 폴백 재발 의심 (미존재 파일이 $code 응답)"; exit 1; }
          python - <<'EOF'
          import json, sys, time, urllib.error, urllib.request
          base = __import__("os").environ.get("SITE_URL", "https://nuclens-v2.pages.dev").rstrip("/") + "/data/"
          cb = f"?cb={int(time.time())}"
          # Cloudflare 는 기본 UA(Python-urllib/3.x)를 봇으로 보고 403 을 준다.
          # 같은 URL 이 curl 로는 200 인데 이 블록만 6종 전부 HTTPError 로 죽어
          # 스모크가 상시 실패하고 있었다(2026-08-02 규명). UA 를 명시한다.
          UA = {"User-Agent": "nuclens-smoke/1.0"}
          names = ["news.json", "briefings.json", "issues.json", "trend.json", "meta.json", "insights.json", "publications.json"]
          # 새로 추가된 파일은 첫 배포 전까지 라이브에 없다. 간격 미달 회차는 배포를
          # 건너뛰고 '직전 배포본'을 검사하므로, 필수로 두면 병합 직후 한 번은
          # 무조건 빨갛게 뜬다. 빌드가 항상 생성한다는 보장은 웹 단위 테스트가
          # 이미 하고 있으므로 여기서는 404 만 눈감아 준다(형식 검사는 그대로).
          TOLERATE_MISSING = {"publications.json"}
          fails, data = [], {}
          for n in names:
              try:
                  req = urllib.request.Request(base + n + cb, headers=UA)
                  r = urllib.request.urlopen(req, timeout=30)
                  ct = r.headers.get("Content-Type", "")
                  if "json" not in ct:
                      fails.append(f"{n}: Content-Type={ct}")
                  data[n] = json.load(r)
              # 상태 코드를 남긴다. 예전엔 'HTTPError' 로만 찍혀 403 인지 404 인지
              # 알 수 없었고, 그래서 원인 파악이 늦었다.
              except urllib.error.HTTPError as e:
                  if e.code == 404 and n in TOLERATE_MISSING:
                      print(f"note: {n} 아직 배포 안 됨 (첫 배포 전) — 스킵")
                      continue
                  fails.append(f"{n}: HTTP {e.code}")
              except Exception as e:
                  fails.append(f"{n}: {type(e).__name__}")
          if not data.get("news.json"):
              fails.append("news.json 0건")
          m = data.get("meta.json") or {}
          b = data.get("briefings.json") or []
          if b and m and b[0].get("date") != m.get("latest_briefing_date"):
              fails.append(f"briefings[0].date({b[0].get('date')}) != meta({m.get('latest_briefing_date')})")
          if fails:
              print("::error::스모크 실패 — " + " | ".join(fails)); sys.exit(1)
          print(f"스모크 OK — 기사 {len(data['news.json'])}건, 최신 브리핑 {m.get('latest_briefing_date')}, JSON 6종 정상")
          EOF

      # 웹 파이프라인 전용 운영 알림.
      #
      # 위쪽 "Update source health + notify administrator" 는 수집 스텝 직후라
      # 웹 결과를 알 수 없다. 그래서 지금까지 크롤에서는 웹이 깨져도 관리자에게
      # 아무 말이 나가지 않았다 — daily-brief 에만 있던 경로다. 같은 CLI 에
      # 웹 outcome 을 넘겨 그 공백을 메운다.
      #
      # --build-mode 는 step outcome 과 다른 축이다. 빌드가 성공해도 국소 identity
      # 충돌을 격리했으면 degraded 이고, 그 사실은 여기 말고 나올 곳이 없다
      # (meta.json/status.json 안에만 있고 아무도 열지 않는다).
      #
      # 관리자 chat id 는 wrangler·빌드가 도는 긴 프로세스에 넘기지 않는다 —
      # 이 짧은 전용 스텝에만 노출한다(daily-brief 와 같은 규칙).
      #
      # 배포 창에 들지 않은 회차는 웹 경로가 **의도적으로** 생략된 것이다. 그
      # 회차까지 평가하면 3시간마다 거짓 경보가 나가므로 스텝 자체를 건너뛴다
      # (daily-brief 가 claim 실패한 날 웹 평가를 생략하는 것과 같은 규칙).
      - name: Notify administrator after web pipeline
        if: always() && steps.web-gate.outputs.should_deploy == 'true'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: >-
          python operational_alerts.py --notify
          --web-build-outcome "${{ steps.web-build.outcome }}"
          --web-deploy-outcome "${{ steps.web-deploy.outcome }}"
          --pipeline-observation-id "crawl:${{ github.run_id }}"
          --build-mode "${{ steps.web-build.outputs.build_mode }}"
          --identity-quarantined "${{ steps.web-build.outputs.identity_quarantined }}"

      # 두 도메인을 **따로** 적는다. 워크플로 결론 한 줄로는 "수집은 됐는데 웹이
      # 깨졌다"를 표현할 수 없고, 그것을 표현하지 못한 것이 이번 사고의 내용이다.
      # 판정 로직은 tools/failure_domains.py 에 있다 — YAML 표현식은 테스트할 수
      # 없기 때문이다.
      - name: Publish failure domains
        if: always()
        continue-on-error: true
        run: >-
          python tools/failure_domains.py --domain crawl
          --collect-outcome "${{ steps.collect.outcome }}"
          --state-outcome "${{ steps.state.outcome }}"
          --web-build-outcome "${{ steps.web-build.outcome }}"
          --web-deploy-outcome "${{ steps.web-deploy.outcome }}"
          --web-smoke-outcome "${{ steps.web-smoke.outcome }}"
          --build-mode "${{ steps.web-build.outputs.build_mode }}"
          --identity-quarantined "${{ steps.web-build.outputs.identity_quarantined }}"

      # 배포가 깨졌을 때만 전수 audit 을 건져 둔다. 러너가 사라지면 그 회차의
      # 진단 재료도 같이 사라지는데, 하필 그때가 재료가 가장 필요한 때다
      # (2026-08-16 · 2026-08-21 둘 다 그렇게 조사할 것이 없었다).
      # 정상 회차의 전수는 daily-brief 가 하루 한 벌 남긴다.
      #
      # **잡의 맨 끝이어야 한다.** `failure()` 는 그 시점까지의 잡 상태를 보므로,
      # 앞에 두면 뒤에 오는 스모크가 깨진 회차에서 이미 스킵된 뒤다 — 그런데
      # "데이터는 올라갔는데 화면이 죽는" 바로 그 경우가 이 스텝의 목적이다.
      # 처음 넣을 때(#42) 이 순서를 놓쳤다.
      #
      # 웹 스텝에 continue-on-error 가 붙은 뒤로 `failure()` 만으로는 부족하다 —
      # 정확히 이 스텝이 노리는 '웹이 깨진 회차'가 이제 잡을 빨갛게 만들지
      # 않기 때문이다. 웹 도메인 실패를 직접 조건에 적는다.
      - name: Upload full issue audit (on failure)
        if: >-
          always() && (failure() ||
          steps.web-build.outcome == 'failure' ||
          steps.web-deploy.outcome == 'failure' ||
          steps.web-smoke.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: issue-audit-full-${{ github.run_id }}
          path: web/_audit/issue_audit.full.json
          retention-days: 14
          if-no-files-found: ignore
