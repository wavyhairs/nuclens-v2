name: Weekly report

on:
  schedule:
    - cron: "7 8 * * 5"  # UTC 08:07 Friday = KST 17:07 Friday; :00 혼잡 회피
  # Friday schedule 자체가 없어져도 다음 성공 crawl이 같은 ISO 주차의 미발송
  # 상태를 확인해 복구한다. 금요일 저녁~일요일 오전만 열어 낡은 발송을 막는다.
  workflow_run:
    workflows: ["Nuclear news crawl"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
      trigger_state: ${{ steps.gate.outputs.trigger_state }}
    steps:
      # event SHA가 아니라 실행 시점의 최신 main을 읽어야, schedule과 recovery가
      # 함께 대기한 경우 먼저 끝난 run의 sent claim을 두 번째 run이 볼 수 있다.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Decide whether Weekly needs recovery
        id: gate
        env:
          TRIGGER_WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          CHANNEL_REQUIRED: ${{ secrets.TELEGRAM_CHANNEL_ID != '' }}
        run: python tools/weekly_trigger_gate.py

  weekly:
    needs: preflight
    if: >-
      needs.preflight.outputs.should_run == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (vars.AUTOMATION_ENABLED == 'true' && vars.BRIEFING_ENABLED == 'true'))
    runs-on: ubuntu-latest
    outputs:
      report_ref: ${{ steps.report-ref.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # ── Gemini 키 모드 (이 잡의 유일한 확인 지점) ───────────────────────
      #
      # 무료/유료는 코드가 아니라 Repository Variable `GEMINI_PAID_MODE` 하나로
      # 고른다. 정확히 `ON` 일 때만 유료 키를 쓰고 OFF·빈 값·미설정·오타는 전부
      # 무료 키다. 전환에 커밋·PR·머지가 필요 없고, **다음에 새로 시작되는
      # 실행부터** 적용된다 — 변수를 바꾸는 것만으로는 아무 워크플로도 안 돈다.
      #
      # 이 스텝이 필요한 이유: 각 스텝이 쓰는 선택 식
      #   vars.GEMINI_PAID_MODE == 'ON' && secrets.GEMINI_API_KEY || secrets.GEMINI_FREE_API_KEY
      # 은 **고른 쪽이 비어 있으면 반대쪽 키로 조용히 넘어간다.** 빈 문자열이
      # falsy 라서 `||` 가 살아나기 때문이다. 유료를 켠 줄 알았는데 무료로 돌거나,
      # 더 나쁘게는 무료로 둔 줄 알았는데 유료가 나간다 — 로그는 어느 쪽이든
      # 평소와 똑같아서 청구서가 오기 전엔 모른다.
      #
      # 그래서 첫 Gemini 스텝보다 **먼저** 골라 본 결과를 확인하고, 어긋나면 잡을
      # 세운다. 여기서 멈추면 뒤 스텝이 돌지 않으므로 잘못된 키로 나가는 호출은 0
      # 이다(뒤의 `if: always()` 스텝들도 claim 스텝 결과에 묶여 있어 함께 건너뛴다).
      #
      # 키 값은 어디에도 안 찍는다. 비교만 하고 라벨(free/paid)만 남긴다.
      - name: Verify Gemini key selection
        env:
          PAID_MODE: ${{ vars.GEMINI_PAID_MODE }}
          SELECTED: ${{ vars.GEMINI_PAID_MODE == 'ON' && secrets.GEMINI_API_KEY || secrets.GEMINI_FREE_API_KEY }}
          PAID_KEY: ${{ secrets.GEMINI_API_KEY }}
          FREE_KEY: ${{ secrets.GEMINI_FREE_API_KEY }}
        run: |
          if [ "$PAID_MODE" = "ON" ]; then
            mode=paid; want="$PAID_KEY"; name=secrets.GEMINI_API_KEY
          else
            mode=free; want="$FREE_KEY"; name=secrets.GEMINI_FREE_API_KEY
          fi
          echo "Gemini key mode: $mode"
          if [ -z "$want" ]; then
            echo "::error::Gemini key mode: $mode 인데 $name 가 비어 있다 — 반대쪽 키로 넘어가지 않고 여기서 멈춘다"
            exit 1
          fi
          if [ "$SELECTED" != "$want" ]; then
            echo "::error::Gemini key mode: $mode 인데 선택 식이 다른 키를 골랐다 — 빈 시크릿으로 인한 폴백을 의심할 것"
            exit 1
          fi

      - name: Plan Weekly report and delivery claim
        run: python weekly_bot.py --plan
        env:
          GEMINI_API_KEY: ${{ vars.GEMINI_PAID_MODE == 'ON' && secrets.GEMINI_API_KEY || secrets.GEMINI_FREE_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.1-flash-lite' }}
          GEMINI_REVIEW_MODEL: ${{ vars.GEMINI_REVIEW_MODEL }}
          GEMINI_INSIGHT_MODEL: ${{ vars.GEMINI_INSIGHT_MODEL }}
          GEMINI_SYNTHESIS_MODEL: ${{ vars.GEMINI_SYNTHESIS_MODEL }}
          GEMINI_SCRIPT_MODEL: ${{ vars.GEMINI_SCRIPT_MODEL }}

      - name: Push Weekly claim before delivery
        id: claim
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git add weekly_reports.json channel_outbox.json
            if git diff --cached --quiet; then
              echo "기존 claim 재사용 — 변경 없음"
              exit 0
            fi
            git commit -m "chore: weekly report claim"
            if git push origin HEAD:main; then
              echo "weekly claim push 성공"
              exit 0
            fi
            echo "claim 충돌 — 최신 main에서 재계획 $i/5"
            git fetch origin main
            git reset --hard origin/main
            python weekly_bot.py --plan
          done
          echo "::error::weekly claim push 5회 실패 — 발송하지 않음"
          exit 1
        env:
          GEMINI_API_KEY: ${{ vars.GEMINI_PAID_MODE == 'ON' && secrets.GEMINI_API_KEY || secrets.GEMINI_FREE_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.1-flash-lite' }}
          GEMINI_REVIEW_MODEL: ${{ vars.GEMINI_REVIEW_MODEL }}
          GEMINI_INSIGHT_MODEL: ${{ vars.GEMINI_INSIGHT_MODEL }}
          GEMINI_SYNTHESIS_MODEL: ${{ vars.GEMINI_SYNTHESIS_MODEL }}
          GEMINI_SCRIPT_MODEL: ${{ vars.GEMINI_SCRIPT_MODEL }}

      - name: Send unconfirmed Weekly destinations
        id: send
        if: steps.claim.outcome == 'success'
        run: python weekly_bot.py --send
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}

      - name: Confirm Weekly delivery and push result
        id: confirm
        if: always() && steps.claim.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            python weekly_bot.py --confirm
            git add weekly_reports.json channel_outbox.json delivery_log.jsonl
            if git diff --cached --quiet; then
              echo "확정할 변경 없음"
              exit 0
            fi
            git commit -m "chore: weekly report confirm"
            if git push origin HEAD:main; then
              echo "weekly confirm push 성공"
              exit 0
            fi
            echo "confirm 충돌 — 발송 결과 보존 후 재병합 $i/5"
            git fetch origin main
            git reset --hard origin/main
          done
          echo "::error::weekly confirm push 5회 실패 — GitHub run 확인 필요"
          exit 1
        env:
          AUTOMATION_TRIGGER_STATE: ${{ needs.preflight.outputs.trigger_state }}

      - name: Publish automation status in run summary
        if: always()
        run: |
          echo "### Weekly result" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- trigger: \`${{ needs.preflight.outputs.trigger_state }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- claim: \`${{ steps.claim.outcome }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- delivery: \`${{ steps.send.outcome }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- confirm: \`${{ steps.confirm.outcome }}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve committed report ref
        id: report-ref
        if: always() && steps.claim.outcome == 'success'
        run: |
          git fetch origin main
          echo "ref=$(git rev-parse origin/main)" >> "$GITHUB_OUTPUT"

  # GITHUB_TOKEN으로 push한 commit은 push workflow를 재귀 실행하지 않는다.
  # 확정된 weekly_reports.json의 SHA를 재사용 가능한 기존 배포 workflow에 넘긴다.
  deploy:
    needs: weekly
    if: always() && needs.weekly.outputs.report_ref != ''
    uses: ./.github/workflows/deploy-web.yml
    with:
      ref: ${{ needs.weekly.outputs.report_ref }}
    secrets: inherit
