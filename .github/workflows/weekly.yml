name: Weekly report

env:
  SITE_URL: ${{ vars.SITE_URL || 'https://nuclens-v2.pages.dev' }}
  CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'nuclens-v2' }}

on:
  schedule:
    - cron: "0 8 * * 5"  # UTC 08:00 Friday = KST 17:00 Friday
  workflow_dispatch:

permissions:
  contents: write   # weekly_reports.json 커밋 (웹 '주간 흐름' 탭 재료)

concurrency:
  group: weekly
  cancel-in-progress: false

jobs:
  weekly:
    # daily-brief 와 같은 규칙 — 이쪽도 텔레그램으로 나간다. 발송 계열은 한
    # 스위치로 묶어야 '주간만 몰래 나가는' 상태가 안 생긴다.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (vars.AUTOMATION_ENABLED == 'true' && vars.BRIEFING_ENABLED == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python weekly_bot.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 주간 판세는 일일 배치를 기다리지 않고 뜨는 즉시 그것 하나만 채널로
          # 나간다 (channel_queue.publish_weekly).
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      # 주간 리포트를 웹이 쓸 수 있게 커밋. 발송이 실패해도 여기까지는 온다.
      - name: Commit weekly report
        if: always()
        run: |
          # 파일별 가드 — 한 파일이 없어서 git add 가 실패하면 스텝 전체가 죽는다
          # (daily_leads.json 데드락과 같은 함정).
          [ -f weekly_reports.json ] || { echo "리포트 파일 없음 — 스킵"; exit 0; }
          git add weekly_reports.json
          # 채널 공개 기록. 없으면 같은 주에 워크플로를 다시 돌릴 때 판세가
          # 채널에 두 번 뜬다.
          if [ -f channel_outbox.json ]; then git add channel_outbox.json; fi
          git diff --cached --quiet && { echo "변경 없음"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: weekly report"
          # 단순 push 반복은 다른 워크플로가 먼저 커밋했으면 3번 다 실패한다.
          # fetch + rebase 로 위에 얹은 뒤 다시 민다.
          for i in 1 2 3; do
            git push origin HEAD:main && exit 0
            git fetch origin main || exit 0
            git rebase origin/main || { git rebase --abort || true; exit 0; }
          done
          echo "리포트 push 실패 — 비치명, 다음 주 재시도"
