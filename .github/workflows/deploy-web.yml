name: Deploy web (화면 코드 변경 시 즉시 배포)

env:
  SITE_URL: ${{ vars.SITE_URL || 'https://nuclens-v2.pages.dev' }}
  CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'nuclens-v2' }}

# 왜 있는가
#
# crawl.yml 도 배포하지만 그건 **데이터 갱신용**이라 짝수 UTC시에만 돈다
# (Pages 무료 500회/월). 그래서 화면 코드를 main 에 병합해도 최대 2시간 동안
# 라이브가 옛 화면이고, 그 사이 "왜 반영이 안 되지"를 매번 다시 확인하게 된다.
#
# 이 워크플로는 변경 파일을 SKIP/FAST/FULL로 분류한다. 화면·Function만 바뀌면
# 검증된 production 데이터 snapshot을 재사용해 수분 내 배포하고, 데이터 계약이나
# builder가 바뀐 경우에만 전체 데이터를 다시 계산한다. 배포 횟수도 화면을 고친 날에만 늘어난다
# (실측: 화면 커밋은 많아야 하루 몇 건 → 월 20~30회 추가).
#
# 'LLM 호출이 전혀 없다'고 적혀 있었는데 사실이 아니다 — build_data 의 이슈 병합
# 판정이 LLM 을 부른다. 그 전제를 믿고 GEMINI_API_KEY 를 안 넘긴 탓에 이 배포만
# 데이터를 열화시켜 덮어썼다(2026-08-16, 아래 Build site data 주석 참조).
# 호출량은 회차당 2~3회 수준이라 소요는 crawl 의 빌드와 같다.
#
# crawl.yml 의 배포 단계는 그대로 둔다. 둘은 트리거가 다르다:
#   crawl.yml   데이터가 바뀌었다  → 3시간마다
#   이 파일     화면 코드가 바뀌었다 → 병합 즉시

on:
  workflow_call:
    inputs:
      ref:
        description: "배포할 commit SHA (자동 생성 데이터 commit 포함)"
        required: false
        type: string
      mode_hint:
        description: "auto|fast|full (workflow_call은 기본 full)"
        required: false
        type: string
        default: full
  push:
    branches: [main]
    paths:
      - "web/**"
      # 엔티티 사전은 web/ 밖(저장소 루트)이지만 화면 데이터(entities.json)의
      # 원료다 — 여기 안 넣으면 사전 수정이 다음 크롤(최대 105분)까지 미배포.
      - "entity_registry.json"
      # 사람이 갱신한 주간 리포트도 즉시 반영한다. Actions가 GITHUB_TOKEN으로
      # 만든 commit은 push workflow를 재귀 실행하지 않으므로 weekly.yml은 아래
      # workflow_call 경로도 함께 사용한다.
      - "weekly_reports.json"
      # Pages Function 도 web/ 밖에 있고, 이 배포가 함께 올린다(wrangler 가
      # **실행 디렉터리 기준**으로 functions/ 를 찾는다 — verify_admin_gate.sh 주석).
      # 여기 안 넣으면 엣지 코드만 고친 커밋이 다음 크롤까지 안 올라가고, 그 사이
      # 콘솔은 새 화면인데 엣지는 옛 검증이다. 증상이 제일 나쁜 쪽으로 나온다 —
      # 화면은 저장했다고 말하는데 엣지가 "알 수 없는 판정 종류입니다"로 되돌린다
      # (2026-08-16 issue_group_split 을 더하며 발견).
      - "functions/**"
      - "tools/render_static_pages.py"
      - "tools/web_deploy_mode.py"
      - "tools/web_snapshot.py"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:
    inputs:
      mode_hint:
        description: "배포 모드 (auto는 변경 목록이 없어 안전하게 full)"
        required: false
        type: choice
        default: full
        options: [full, fast, auto]

permissions:
  contents: read          # 상태를 커밋하지 않는다 — 배포만 한다
  actions: write          # 검증된 production snapshot 저장

concurrency:
  # crawl 과 같은 그룹에 두면 매시 크롤이 이 배포를 취소한다. 별도 그룹이되
  # 같은 워크플로끼리는 직렬화한다. 진행 중인 전체 빌드는 취소하지 않는다.
  group: deploy-web
  # 거의 끝난 20분 빌드를 새 UI push가 취소하고 처음부터 다시 계산한 실사고
  # (2026-09-18)를 막는다. 최신 세대 가드는 publish 직전에 별도로 적용한다.
  cancel-in-progress: false

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 2
      - name: Classify web deployment
        id: mode
        run: |
          python tools/web_deploy_mode.py \
            --base "${{ github.event.before }}" \
            --head "${{ inputs.ref || github.sha }}" \
            --mode-hint "${{ inputs.mode_hint || 'auto' }}"

  deploy:
    needs: classify
    if: needs.classify.outputs.mode != 'skip'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore latest production web snapshot
        if: needs.classify.outputs.mode == 'fast'
        id: production-snapshot-cache
        uses: actions/cache/restore@v4
        with:
          path: web/_production_snapshot
          key: ${{ runner.os }}-nuclens-web-production-never-matches
          restore-keys: |
            ${{ runner.os }}-nuclens-web-production-

      - name: Inspect production snapshot
        if: needs.classify.outputs.mode == 'fast' && steps.production-snapshot-cache.outputs.cache-hit != ''
        id: production-snapshot
        run: python tools/web_snapshot.py inspect

      - name: Resolve effective deploy mode
        id: effective-mode
        env:
          REQUESTED_MODE: ${{ needs.classify.outputs.mode }}
          SNAPSHOT_COMPATIBLE: ${{ steps.production-snapshot.outputs.compatible }}
        run: |
          mode="$REQUESTED_MODE"
          if [ "$mode" = "fast" ] && [ "$SNAPSHOT_COMPATIBLE" != "true" ]; then
            echo "::warning::검증된 호환 snapshot 없음 — 이번 한 번은 FULL로 self-healing"
            mode=full
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Effective deploy mode: ${mode^^}"

      - name: Restore production data into current shell
        if: steps.effective-mode.outputs.mode == 'fast'
        run: python tools/web_snapshot.py restore

      # ── Gemini 키 모드 (이 잡의 유일한 확인 지점) ───────────────────────
      #
      # 무료/유료는 코드가 아니라 Repository Variable `GEMINI_PAID_MODE` 하나로
      # 고른다. 정확히 `ON` 일 때만 유료 키를 쓰고 OFF·빈 값·미설정·오타는 전부
      # 무료 키다. 전환에 커밋·PR·머지가 필요 없고, **다음에 새로 시작되는
      # 실행부터** 적용된다 — 변수를 바꾸는 것만으로는 아무 워크플로도 안 돈다.
      #
      # 이 스텝이 필요한 이유: 각 스텝이 쓰는 선택 식
      #   vars.GEMINI_PAID_MODE == 'ON' && secrets.GEMINI_API_KEY || secrets.GEMINI_FREE_API_KEY
      # 은 **고른 쪽이 비어 있으면 반대쪽 키로 조용히 넘어간다.** 빈 문자열이
      # falsy 라서 `||` 가 살아나기 때문이다. 유료를 켠 줄 알았는데 무료로 돌거나,
      # 더 나쁘게는 무료로 둔 줄 알았는데 유료가 나간다 — 로그는 어느 쪽이든
      # 평소와 똑같아서 청구서가 오기 전엔 모른다.
      #
      # 그래서 첫 Gemini 스텝보다 **먼저** 골라 본 결과를 확인하고, 어긋나면 잡을
      # 세운다. 여기서 멈추면 뒤 스텝이 돌지 않으므로 잘못된 키로 나가는 호출은 0
      # 이다(뒤의 `if: always()` 스텝들도 claim 스텝 결과에 묶여 있어 함께 건너뛴다).
      #
      # 키 값은 어디에도 안 찍는다. 비교만 하고 라벨(free/paid)만 남긴다.
      - name: Verify Gemini key selection
        if: steps.effective-mode.outputs.mode == 'full'
        env:
          PAID_MODE: ${{ vars.GEMINI_PAID_MODE }}
          SELECTED: ${{ vars.GEMINI_PAID_MODE == 'ON' && secrets.GEMINI_API_KEY || secrets.GEMINI_FREE_API_KEY }}
          PAID_KEY: ${{ secrets.GEMINI_API_KEY }}
          FREE_KEY: ${{ secrets.GEMINI_FREE_API_KEY }}
        run: |
          if [ "$PAID_MODE" = "ON" ]; then
            mode=paid; want="$PAID_KEY"; name=secrets.GEMINI_API_KEY
          else
            mode=free; want="$FREE_KEY"; name=secrets.GEMINI_FREE_API_KEY
          fi
          echo "Gemini key mode: $mode"
          if [ -z "$want" ]; then
            echo "::error::Gemini key mode: $mode 인데 $name 가 비어 있다 — 반대쪽 키로 넘어가지 않고 여기서 멈춘다"
            exit 1
          fi
          if [ "$SELECTED" != "$want" ]; then
            echo "::error::Gemini key mode: $mode 인데 선택 식이 다른 키를 골랐다 — 빈 시크릿으로 인한 폴백을 의심할 것"
            exit 1
          fi

      # embeddings.json 은 git 이 아니라 Actions 캐시에 산다. 없이 빌드하면
      # 이슈 병합이 로컬 폴백으로 떨어져 crawl 이 만든 것과 클러스터가 달라진다.
      # 읽기만 하고 저장하지 않는다 — 캐시의 주인은 crawl.yml 이다.
      - name: Restore embeddings cache
        if: steps.effective-mode.outputs.mode == 'full'
        uses: actions/cache/restore@v4
        with:
          path: embeddings.json
          key: ${{ runner.os }}-nuclear-embeddings-never-matches
          restore-keys: |
            ${{ runner.os }}-nuclear-embeddings-

      # 오디오 브리핑 mp3 도 캐시에만 산다 — 없이 배포하면 라이브에서 사라진다.
      # 역시 읽기만 한다 (주인은 daily-brief.yml).
      - name: Restore audio cache
        if: steps.effective-mode.outputs.mode == 'full'
        uses: actions/cache/restore@v4
        with:
          path: web/public/data/audio
          key: ${{ runner.os }}-nuclens-audio-never-matches
          restore-keys: |
            ${{ runner.os }}-nuclens-audio-

      # 콘솔 판정을 빌드 전에 내려놓는다. 여기서 커밋하지는 않는다(이 워크플로는
      # 상태 파일을 커밋하지 않는다) — 콘솔 화면이 자기 편집을 그대로 되비추게 하는
      # 것이 목적이고, 저장소 기록은 crawl·daily-brief 가 남긴다.
      - name: Sync admin console judgments
        if: steps.effective-mode.outputs.mode == 'full'
        continue-on-error: true
        run: python tools/sync_admin_overrides.py
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Build site data
        if: steps.effective-mode.outputs.mode == 'full'
        env:
          # crawl·daily-brief 와 같은 이유로 필요하다 — build_data 의 이슈 병합
          # 회색지대 판정이 LLM 을 부른다. 키가 없으면 판정이 '병합 안 함'으로
          # 떨어지고, 이 워크플로는 그 결과를 라이브에 덮어쓴다.
          #
          # 2026-08-16 실측. 같은 데이터로 crawl 은 `호출 2회 → 실패 0`,
          # 이 워크플로는 `호출 0회 → 실패 40 [no_api_key]` 였다. 미판정 쌍이
          # 안 묶인 채 남아 이슈가 잘게 쪼개졌고(V1 대비 이슈 +9%, 평균 생존
          # 1.28→1.13주), 주별 이슈 합계가 내려가 흐름 탭의 주간 비교 게이트
          # (topicWeeksComparable, 비율 2.0)를 2.02 로 넘겨 버렸다 — 주제 흐름
          # 표와 슬로프 그래프가 둘 다 사라졌다.
          #
          # '화면만 다시 올린다'는 이 워크플로가 데이터 품질을 바꾸면 안 된다.
          GEMINI_API_KEY: ${{ vars.GEMINI_PAID_MODE == 'ON' && secrets.GEMINI_API_KEY || secrets.GEMINI_FREE_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.1-flash-lite' }}
        run: python web/build_data.py

      - name: Render static entry pages with current shell
        run: python tools/render_static_pages.py

      # app.js 파스 에러는 콘솔에 안 잡히고 화면만 "불러오고 있습니다"에서 얼어
      # 데이터 문제로 오진하게 만든다(2026-08-01 실사고). 배포 전에 막는다.
      - name: Check app.js parses
        run: node --check web/public/app.js
      - name: Date math (app.js)
        run: node web/tests/date_window.mjs
      - name: Trend period state (app.js)
        run: node web/tests/trend_period_state.mjs
      - name: Admin gate contract
        run: node web/tests/admin_gate.mjs

      # 콘솔이 실제 빌드 산출물로 끝까지 그려지는가. 파이썬 테스트는 JSON 의 모양을
      # 보지 그 JSON 을 받은 admin.js 가 예외 없이 도는지는 못 본다 — 그 실패는
      # 흰 화면 하나로만 나타나고 관리자는 '데이터가 없다'로 읽는다.
      - name: Admin console renders
        run: node web/tests/admin_render.mjs

      # 흉내 DOM 이 못 보는 자리. 흉내는 **내가 아는 것만** 흉내 내므로 내가 틀리게
      # 아는 것은 그대로 통과한다 — 2026-08-22 배포가 그 값을 치렀다. '먼저 확인할
      # 것'의 버튼도 data-fold 를 들고 문서에서 앞에 서는 바람에 칸을 찾는
      # querySelector 가 버튼을 돌려줬고, 우선 확인에 걸린 칸 셋이 통째로 안 그려진
      # 채 라이브에 올라갔다(요약 줄에 '건수를 세는 중'이 그대로 남았다). 흉내
      # DOM 은 그때도 초록불이었다.
      #
      # 러너 이미지에 있는 크롬을 --dump-dom 으로 부른다 — playwright 를 쓰면
      # 브라우저 내려받기 2분이 매 배포에 붙는다.
      - name: Admin console renders in a real browser
        run: node web/tests/admin_dom.mjs
      - name: Run web tests
        env:
          NUCLENS_SKIP_DATA_GATES: "1"
        run: cd web && python -m unittest discover -s tests

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN 미설정 — 배포할 수 없다"
            exit 1
          fi
          if [ "${{ steps.effective-mode.outputs.mode }}" = "fast" ]; then
            python tools/web_snapshot.py guard-live --site-url "$SITE_URL" --policy equal
          else
            python tools/web_snapshot.py guard-live --site-url "$SITE_URL" --policy not-older
          fi
          npx --yes wrangler@4 pages deploy web/public \
            --project-name="$CLOUDFLARE_PAGES_PROJECT" --branch=main --commit-dirty=true

      # "데이터는 올라갔는데 화면이 죽는" 사고 재발 감지. curl 만으로는 부족하다는
      # 것이 실측됐지만(변형별 엣지 캐시), SPA 폴백 재발은 이걸로 잡힌다.
      - name: Smoke test live site
        run: |
          sleep 15
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            "$SITE_URL/data/__missing__.json?cb=$(date +%s)")
          [ "$code" = "404" ] || {
            echo "::error::스모크 실패 — SPA 폴백 재발 의심 (미존재 파일이 $code 응답)"
            exit 1
          }
          echo "스모크 통과 — 미존재 경로가 404"

      # 운영 콘솔이 실제로 잠겼는지는 **살아 있는 사이트에** 물어야 안다. Function
      # 폴더가 업로드에서 빠져도 배포는 조용히 성공하고 /admin 은 그냥 열린다.
      - name: Verify admin console is locked
        run: bash web/tools/verify_admin_gate.sh "$SITE_URL"

      - name: Create verified production snapshot
        if: steps.effective-mode.outputs.mode == 'full'
        id: web-snapshot
        run: |
          python tools/web_snapshot.py create \
            --site-url "$SITE_URL" \
            --source-commit "$(git rev-parse HEAD)"

      - name: Save verified production snapshot
        if: steps.effective-mode.outputs.mode == 'full'
        id: production-snapshot-save
        uses: actions/cache/save@v4
        with:
          path: web/_production_snapshot
          key: ${{ runner.os }}-nuclens-web-production-${{ steps.web-snapshot.outputs.generation_id }}

      - name: Prune old production snapshots
        if: steps.production-snapshot-save.outcome == 'success'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/prune_actions_caches.py --prefix "${RUNNER_OS}-nuclens-web-production-" --keep 2

      # 배포가 깨졌을 때만 전수 audit 을 건져 둔다. 러너가 사라지면 그 회차의
      # 진단 재료도 같이 사라지는데, 하필 그때가 재료가 가장 필요한 때다
      # (2026-08-16 · 2026-08-21 둘 다 그렇게 조사할 것이 없었다).
      # 정상 회차의 전수는 daily-brief 가 하루 한 벌 남긴다.
      #
      # **잡의 맨 끝이어야 한다.** `failure()` 는 그 시점까지의 잡 상태를 보므로,
      # 앞에 두면 뒤에 오는 스모크·관리자 게이트가 깨진 회차에서는 이 스텝이
      # 이미 스킵된 뒤다 — 그런데 "데이터는 올라갔는데 화면이 죽는" 바로 그
      # 경우가 위 주석이 적어 둔 목적이다. 처음 넣을 때(#42) 이 순서를 놓쳤다.
      - name: Upload full issue audit (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
