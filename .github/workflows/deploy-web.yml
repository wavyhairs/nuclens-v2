name: Deploy web (화면 코드 변경 시 즉시 배포)

env:
  SITE_URL: ${{ vars.SITE_URL || 'https://nuclens-v2.pages.dev' }}
  CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'nuclens-v2' }}

# 왜 있는가
#
# crawl.yml 도 배포하지만 그건 **데이터 갱신용**이라 짝수 UTC시에만 돈다
# (Pages 무료 500회/월). 그래서 화면 코드를 main 에 병합해도 최대 2시간 동안
# 라이브가 옛 화면이고, 그 사이 "왜 반영이 안 되지"를 매번 다시 확인하게 된다.
#
# 이 워크플로는 **화면 파일이 바뀔 때만** 돈다. 수집·큐레이션이 없어서 3~4분이면
# 끝나고, 배포 횟수도 화면을 고친 날에만 늘어난다
# (실측: 화면 커밋은 많아야 하루 몇 건 → 월 20~30회 추가).
#
# 'LLM 호출이 전혀 없다'고 적혀 있었는데 사실이 아니다 — build_data 의 이슈 병합
# 판정이 LLM 을 부른다. 그 전제를 믿고 GEMINI_API_KEY 를 안 넘긴 탓에 이 배포만
# 데이터를 열화시켜 덮어썼다(2026-08-16, 아래 Build site data 주석 참조).
# 호출량은 회차당 2~3회 수준이라 소요는 crawl 의 빌드와 같다.
#
# crawl.yml 의 배포 단계는 그대로 둔다. 둘은 트리거가 다르다:
#   crawl.yml   데이터가 바뀌었다  → 3시간마다
#   이 파일     화면 코드가 바뀌었다 → 병합 즉시

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      # 엔티티 사전은 web/ 밖(저장소 루트)이지만 화면 데이터(entities.json)의
      # 원료다 — 여기 안 넣으면 사전 수정이 다음 크롤(최대 105분)까지 미배포.
      - "entity_registry.json"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:      # 데이터는 그대로 두고 화면만 다시 올리고 싶을 때

permissions:
  contents: read          # 상태를 커밋하지 않는다 — 배포만 한다

concurrency:
  # crawl 과 같은 그룹에 두면 매시 크롤이 이 배포를 취소한다. 별도 그룹이되
  # 이 워크플로끼리는 최신 것만 남긴다(연속 커밋 시 중간 배포는 의미 없음).
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # embeddings.json 은 git 이 아니라 Actions 캐시에 산다. 없이 빌드하면
      # 이슈 병합이 로컬 폴백으로 떨어져 crawl 이 만든 것과 클러스터가 달라진다.
      # 읽기만 하고 저장하지 않는다 — 캐시의 주인은 crawl.yml 이다.
      - name: Restore embeddings cache
        uses: actions/cache/restore@v4
        with:
          path: embeddings.json
          key: ${{ runner.os }}-nuclear-embeddings-never-matches
          restore-keys: |
            ${{ runner.os }}-nuclear-embeddings-

      # 오디오 브리핑 mp3 도 캐시에만 산다 — 없이 배포하면 라이브에서 사라진다.
      # 역시 읽기만 한다 (주인은 daily-brief.yml).
      - name: Restore audio cache
        uses: actions/cache/restore@v4
        with:
          path: web/public/data/audio
          key: ${{ runner.os }}-nuclens-audio-never-matches
          restore-keys: |
            ${{ runner.os }}-nuclens-audio-

      - name: Build site data
        env:
          # crawl·daily-brief 와 같은 이유로 필요하다 — build_data 의 이슈 병합
          # 회색지대 판정이 LLM 을 부른다. 키가 없으면 판정이 '병합 안 함'으로
          # 떨어지고, 이 워크플로는 그 결과를 라이브에 덮어쓴다.
          #
          # 2026-08-16 실측. 같은 데이터로 crawl 은 `호출 2회 → 실패 0`,
          # 이 워크플로는 `호출 0회 → 실패 40 [no_api_key]` 였다. 미판정 쌍이
          # 안 묶인 채 남아 이슈가 잘게 쪼개졌고(V1 대비 이슈 +9%, 평균 생존
          # 1.28→1.13주), 주별 이슈 합계가 내려가 흐름 탭의 주간 비교 게이트
          # (topicWeeksComparable, 비율 2.0)를 2.02 로 넘겨 버렸다 — 주제 흐름
          # 표와 슬로프 그래프가 둘 다 사라졌다.
          #
          # '화면만 다시 올린다'는 이 워크플로가 데이터 품질을 바꾸면 안 된다.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.1-flash-lite' }}
        run: python web/build_data.py

      # app.js 파스 에러는 콘솔에 안 잡히고 화면만 "불러오고 있습니다"에서 얼어
      # 데이터 문제로 오진하게 만든다(2026-08-01 실사고). 배포 전에 막는다.
      - name: Check app.js parses
        run: node --check web/public/app.js

      # 날짜 산술은 파이썬 테스트가 못 잡는다 — app.js 안에 있고 의존성이 없어서
      # 지금까지 수동 실행 전용이었다. '최근 7일이 8일이 되던' 종류의 off-by-one 과
      # 주간 리포트 구간(토~금) 매칭이 여기에 걸린다. 3초짜리라 배포 경로에 둔다.
      - name: Date math (app.js)
        run: node web/tests/date_window.mjs

      # 운영 콘솔 자물쇠는 엣지에서 도는 JS 이고 해시·세션·비밀번호 규칙이 전부
      # 그 안에 있다. 여기가 어긋나면 맞는 비밀번호로도 못 들어가거나 반대로
      # 아무거나 통과하는데, 어느 쪽이든 배포 뒤에야 알게 된다.
      - name: Admin gate contract
        run: node web/tests/admin_gate.mjs

      # 데이터 지표 게이트는 끈다. 추적률은 "오늘 뉴스가 어떻게 묶였나"의 결과지
      # 화면 코드의 성질이 아니다 — 켜 두면 뉴스가 한산한 날 CSS 오타 수정도
      # 배포가 막힌다(2026-08-03 실측: 추적률 0.125 로 이 워크플로 첫 실행이 실패).
      # 그 게이트는 crawl.yml·로컬에서 계속 켜져 있다.
      - name: Run web tests
        env:
          NUCLENS_SKIP_DATA_GATES: "1"
        run: cd web && python -m unittest discover -s tests

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN 미설정 — 배포할 수 없다"
            exit 1
          fi
          npx --yes wrangler@4 pages deploy web/public \
            --project-name="$CLOUDFLARE_PAGES_PROJECT" --branch=main --commit-dirty=true

      # "데이터는 올라갔는데 화면이 죽는" 사고 재발 감지. curl 만으로는 부족하다는
      # 것이 실측됐지만(변형별 엣지 캐시), SPA 폴백 재발은 이걸로 잡힌다.
      - name: Smoke test live site
        run: |
          sleep 15
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            "$SITE_URL/data/__missing__.json?cb=$(date +%s)")
          [ "$code" = "404" ] || {
            echo "::error::스모크 실패 — SPA 폴백 재발 의심 (미존재 파일이 $code 응답)"
            exit 1
          }
          echo "스모크 통과 — 미존재 경로가 404"

      # 운영 콘솔이 실제로 잠겼는지는 **살아 있는 사이트에** 물어야 안다. Function
      # 폴더가 업로드에서 빠져도 배포는 조용히 성공하고 /admin 은 그냥 열린다.
      - name: Verify admin console is locked
        run: bash web/tools/verify_admin_gate.sh "$SITE_URL"
