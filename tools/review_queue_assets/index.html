<meta charset="utf-8">
<title>Nuclens 판정 대기열</title>
<style>
  :root { color-scheme: light dark; --line:#8883; --ok:#1a7f37; --warn:#9a6700; }
  body { font:15px/1.6 system-ui,-apple-system,"Malgun Gothic",sans-serif; margin:0; }
  header { padding:12px 20px; border-bottom:1px solid var(--line); display:flex;
           gap:16px; align-items:baseline; flex-wrap:wrap; position:sticky; top:0;
           background:Canvas; }
  h1 { font-size:16px; margin:0; }
  #progress { color:#666; font-variant-numeric:tabular-nums; }
  main { max-width:900px; margin:0 auto; padding:20px; }
  .note { background:#8881; border-left:3px solid var(--warn); padding:10px 14px;
          margin-bottom:18px; border-radius:0 4px 4px 0; }
  .card { border:1px solid var(--line); border-radius:6px; padding:14px 16px;
          margin-bottom:14px; }
  .card h2 { font-size:12px; letter-spacing:.08em; text-transform:uppercase;
             color:#777; margin:0 0 10px; }
  .row { display:grid; grid-template-columns:120px 1fr; gap:4px 14px; margin:6px 0; }
  .row b { color:#666; font-weight:500; font-size:13px; }
  .pair { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:720px) { .pair { grid-template-columns:1fr; } }
  pre { white-space:pre-wrap; word-break:break-word; margin:0; font:inherit; }
  #verdicts { display:flex; gap:8px; flex-wrap:wrap; margin:18px 0; }
  button { font:inherit; padding:9px 16px; border:1px solid var(--line);
           background:Canvas; color:CanvasText; border-radius:5px; cursor:pointer; }
  button:hover { border-color:currentColor; }
  button.on { background:var(--ok); color:#fff; border-color:var(--ok); }
  nav { display:flex; gap:8px; align-items:center; }
  #done { color:var(--ok); }
</style>
<header>
  <h1>Nuclens 판정 대기열</h1>
  <span id="progress"></span>
  <nav>
    <button id="prev">← 이전</button>
    <button id="next">다음 →</button>
    <span id="done"></span>
  </nav>
</header>
<main>
  <div class="note" id="note"></div>
  <div id="case"></div>
  <div id="verdicts"></div>
</main>
<script src="/app.js"></script>
